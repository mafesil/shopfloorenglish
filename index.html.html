const KEY="sfe.progress.v1";
const DEFAULT={xp:0,days:{},streak:0,lastDay:"",scn:{},words:{},sprog:{},lprog:{},chats:[],research:[],myterms:[],
  settings:{accent:"en-US",rate:0.95,level:"Intermediário",showPh:true}};
function merge(o){return {...JSON.parse(JSON.stringify(DEFAULT)),...o,settings:{...DEFAULT.settings,...(o.settings||{})}}}
let P=load();
function load(){try{const r=localStorage.getItem(KEY);if(r)return merge(JSON.parse(r))}catch(e){}return merge({})}
let dbRef=null,saveTimer=null;
function trimState(){P.chats=P.chats.slice(0,15);P.chats.forEach(c=>{if(c.hist.length>120)c.hist=c.hist.slice(-120)});P.research=P.research.slice(0,15)}
function save(){trimState();try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}
  if(dbRef){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{dbRef.set(JSON.parse(JSON.stringify(P))).catch(()=>{})},1500)}}
(async()=>{try{
  if(!window.claude||!window.claude.use)return;
  const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
  if(!user||!db)return;
  const id=await user.id(); if(!id)return;
  const ref=db.collection("data/users/"+id).doc("progress");
  const snap=await ref.get();
  if(snap.exists){const r=snap.data()||{};const rt=(r.chats||[]).reduce((a,c)=>Math.max(a,c.updated||0),0),lt=P.chats.reduce((a,c)=>Math.max(a,c.updated||0),0);
    if((r.xp||0)>(P.xp||0)||rt>lt){P=merge(r);try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}refreshStats();if(view==="home")renderHome()}}
  dbRef=ref; save();
}catch(e){}})();

function dayKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return dayKey(d)}
function addXP(n){const t=dayKey();P.days[t]=(P.days[t]||0)+n;P.xp+=n;
  if(P.lastDay!==t){P.streak=(P.lastDay===yesterday())?P.streak+1:1;P.lastDay=t}
  save();refreshStats();}
function curStreak(){return (P.lastDay===dayKey()||P.lastDay===yesterday())?P.streak:0}
function refreshStats(){document.getElementById("stXp").textContent=P.xp;document.getElementById("stStreak").textContent=curStreak()}
const GOAL=60;
function fmtDate(t){try{return new Date(t).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})+" "+new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}

function phCore(t){return String(t).toLowerCase().replace(/[’‘]/g,"'").replace(/^[^a-z0-9']+|[^a-z0-9']+$/g,"").replace(/^'+|'+$/g,"")}
function phOf(c){if(!c||/^\d/.test(c))return "";
  if(PHD[c])return PHD[c];if(PHX[c])return PHX[c];
  if(c.endsWith("'s")){const b=phOf(c.slice(0,-2));if(b)return b+"z"}
  if(c.includes("-")){const ps=c.split("-").filter(Boolean).map(x=>PHD[x]||PHX[x]||"");if(ps.length&&ps.every(Boolean))return ps.join("-")}
  if(/^\d/.test(c))return "";queueMissing(c);return ""}
function phHTML(text,cls){
  if(!P.settings.showPh)return `<span class="${cls||""}">${esc(disp(text))}</span>`;
  return `<span class="phl ${cls||""}">`+String(text).split(/\s+/).filter(Boolean).map(t=>{const c=phCore(t),ph=phOf(c);
    return `<span class="pw"><span>${esc(disp(t))}</span><small data-w="${esc(c)}">${esc(ph||"")}</small></span>`}).join(" ")+`</span>`}
let missQ=new Set(),missTimer=null,missBusy=false;
function queueMissing(c){if(!c||c.length<2||/\d/.test(c)||!(window.claude&&window.claude.use))return;missQ.add(c);clearTimeout(missTimer);missTimer=setTimeout(fillMissing,600)}
async function fillMissing(){if(missBusy||!missQ.size)return;const sample=await getSample();if(!sample){missQ.clear();return}
  const words=[...missQ].slice(0,40);words.forEach(w=>missQ.delete(w));missBusy=true;
  try{const out=await sample.json(`Respell each English word below so a Brazilian Portuguese speaker can pronounce it (American English). Conventions: syllables separated by "-", stressed syllable in UPPERCASE. Vowels: á (hot), é (cat, bed), â (cup, schwa), ó (law), ii (see), i (sit), uu (food), u (book), ei (day), ai (my), au (now), ou (go), ói (boy), âr (bird, butter). Consonants as in Portuguese, plus: h (English h), r (English r), th (think), dh (this), ch (she), tch (church), dj (judge), j (measure), u for w, i for y, k for c/k, gu before e/i.
Examples: vibration=vai-BREI-chân, bearing=BÉ-ring, the=DHÂ, gearbox=GUIR-báks, schedule=SKÉ-djul, water=UÓ-târ, thanks=THÉNGKS.
Return ONLY a JSON object mapping each word exactly as given to its respelling.
Words: ${JSON.stringify(words)}`,{modelTier:"quick"});
    if(out&&typeof out==="object"){for(const [k,v] of Object.entries(out)){if(typeof v==="string"&&v.length<40){const kk=phCore(k);PHX[kk]=v;document.querySelectorAll(`small[data-w="${CSS.escape(kk)}"]`).forEach(el=>{if(!el.textContent)el.textContent=v})}}
      try{localStorage.setItem(PHXKEY,JSON.stringify(PHX))}catch(e){}}
  }catch(e){}finally{missBusy=false;if(missQ.size)setTimeout(fillMissing,1500)}}

function pickVoice(){const lang=P.settings.accent;const pref=voices.filter(v=>v.lang.replace("_","-").toLowerCase().startsWith(lang.toLowerCase()));
  return pref.find(v=>/natural|neural|google|samantha|aria|jenny|guy|daniel|serena|libby|ryan/i.test(v.name))||pref[0]||voices.find(v=>/^en/i.test(v.lang))}
function speak(text,slow){return new Promise(res=>{if(!("speechSynthesis" in window)||document.hidden)return res();
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/’/g,"'"));u.lang=P.settings.accent;const v=pickVoice();if(v)u.voice=v;
   u.rate=slow?0.7:P.settings.rate;u.onend=res;u.onerror=res;speechSynthesis.speak(u)}catch(e){res()}})}

/* Componente: zona de fala (microfone + ditado). Nunca liga sozinho; você fala quantas vezes quiser. */
function speakZone(container,onAnswer,opts={}){
  const tm=!SR||!!P.settings.typeMode;
  container.innerHTML=`<div class="miczone">
    ${tm?"":`<button class="mic" aria-label="Falar" title="Toque e fale em inglês">${micSVG()}</button>`}
    <div class="heard" aria-live="polite">${tm?"Modo ditado: toque na caixa, depois no microfone do teclado, e fale em inglês.":(opts.hint||"Toque no microfone e fale em inglês. Repita quantas vezes quiser.")}</div>
    <div class="confirm" hidden><div class="said"></div><div class="rowbtns"><button class="btn cf-send">Enviar esta resposta</button><button class="btn ghost cf-again">Falar de novo</button></div></div>
    <div class="typebox ${tm?"on":""}"><input type="text" lang="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Fale pelo ditado do teclado ou digite" aria-label="Resposta por ditado ou digitada"><button class="btn">Enviar</button></div>
    ${SR?`<button class="linkbtn tg">${tm?"Tentar o microfone do app":"Usar o ditado do teclado"}</button>`:""}
    <div class="err"></div></div>`;
  const mic=container.querySelector(".mic"),heard=container.querySelector(".heard"),tb=container.querySelector(".typebox"),inp=tb.querySelector("input"),err=container.querySelector(".err"),cf=container.querySelector(".confirm");
  const tg=container.querySelector(".tg"); if(tg)tg.onclick=()=>{P.settings.typeMode=!tm;save();speakZone(container,onAnswer,opts);if(!tm){const i=container.querySelector(".typebox input");if(i)i.focus()}};
  let pend=null;
  const deliver=(cands,text,typed)=>{if(opts.confirm&&!typed){pend=[cands,text];cf.querySelector(".said").innerHTML=`<div class="note">Você disse:</div>`+phHTML(text,"bigsaid");cf.hidden=false;heard.textContent="Se ficou bom, envie. Se não, fale de novo.";return}
    onAnswer(cands,text)};
  cf.querySelector(".cf-send").onclick=()=>{if(!pend)return;cf.hidden=true;const p=pend;pend=null;onAnswer(p[0],p[1])};
  cf.querySelector(".cf-again").onclick=()=>{cf.hidden=true;pend=null;if(mic)start();else inp.focus()};
  const submitTyped=()=>{const v=inp.value.trim();if(!v)return;inp.value="";cf.hidden=true;pend=null;deliver([v],v,true)};
  tb.querySelector("button").onclick=submitTyped; inp.onkeydown=e=>{if(e.key==="Enter")submitTyped()};
  function start(){
    if(document.hidden)return;
    if(activeRec){try{activeRec.stop()}catch(e){}return}
    err.innerHTML="";leftApp=false;try{speechSynthesis.cancel()}catch(e){}
    const r=new SR();r.lang=P.settings.accent;r.interimResults=true;r.maxAlternatives=3;r.continuous=false;
    let finals=[],alts=[],failed=false;
    r.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];
      if(res.isFinal){finals.push(res[0].transcript);alts=[...res].map(a=>a.transcript)}else interim+=res[0].transcript}
      heard.textContent=disp((finals.join(" ")+" "+interim).trim())||"Ouvindo…"};
    r.onerror=e=>{failed=true;if(e.error!=="aborted")err.innerHTML=`<div class="warnbox">${ERR[e.error]||"Não foi possível ouvir agora ("+esc(e.error)+"). Tente de novo ou digite."}</div>`;
      if(e.error==="not-allowed"||e.error==="service-not-allowed"){P.settings.typeMode=true;save();const msg=err.innerHTML;speakZone(container,onAnswer,opts);container.querySelector(".err").innerHTML=msg}};
    r.onend=()=>{activeRec=null;if(!mic.isConnected)return;mic.classList.remove("on");mic.setAttribute("aria-label","Falar");
      if(leftApp){heard.textContent="Microfone desligado porque você saiu do app. Toque nele para falar de novo.";return}
      const text=finals.join(" ").trim();
      if(text){const cands=[text];if(finals.length===1)alts.slice(1).forEach(a=>cands.push(a));deliver(cands,text)}
      else if(!failed){heard.textContent="Não ouvi nada. Toque e fale de novo."}};
    try{r.start();activeRec=r;mic.classList.add("on");mic.setAttribute("aria-label","Parar");heard.textContent="Ouvindo… (toque de novo para parar)"}catch(e){err.innerHTML=`<div class="warnbox">Não foi possível iniciar o microfone. Use o ditado do teclado.</div>`;tb.classList.add("on")}
  }
  if(mic)mic.onclick=start;
  return {setHeard:t=>{const h=container.querySelector(".heard");if(h)h.textContent=t},disable:v=>{const m=container.querySelector(".mic");if(m)m.disabled=v||!SR;const b=container.querySelector(".typebox button");if(b)b.disabled=!!v}};
}

function scnRows(list){return `<div class="list">${list.map(s=>{const d=P.scn[s.id]&&P.scn[s.id].done,ip=!!P.sprog[s.id];return `
    <button class="row ${d?"done":""}" data-s="${s.id}"><span class="av">${s.partner[0]}</span>
     <span class="tx"><span class="tt">${esc(s.title)}</span><span class="dd" style="display:block">${s.partner}, ${esc(s.role)}</span></span>
     <span class="tag ${d&&!ip?"ok":""}">${ip?"Em andamento":d?"Feita":s.level}</span></button>`}).join("")}</div>`}
function resumeRows(){const rows=[];
  for(const [id,st] of Object.entries(P.sprog)){const s=SCENARIOS.find(x=>x.id===id);if(s)rows.push({t:st.at||0,html:`<div class="hub"><div class="tx"><b>${esc(s.title)}</b><span class="dd">Conversa roteirizada · ${st.turns||0} falas suas</span></div><div class="rowbtns"><button class="btn sm" data-rs="${id}">Continuar</button><button class="btn ghost sm" data-zs="${id}">Do zero</button></div></div>`})}
  for(const [id,st] of Object.entries(P.lprog)){const u=getUnit(id);if(u)rows.push({t:st.at||0,html:`<div class="hub"><div class="tx"><b>${esc(u.title)}</b><span class="dd">Lição falada · item ${st.pos+1} de ${st.items.length}</span></div><div class="rowbtns"><button class="btn sm" data-rl="${id}">Continuar</button><button class="btn ghost sm" data-zl="${id}">Do zero</button></div></div>`})}
  P.chats.slice(0,3).forEach(c=>rows.push({t:c.updated||0,html:`<div class="hub"><div class="tx"><b>${esc(c.title||"Conversa com IA")}</b><span class="dd">Conversa com IA · ${esc(c.partner||"")} · ${c.hist.filter(h=>h.who==="me").length} falas suas</span></div><div class="rowbtns"><button class="btn sm" data-rc="${c.id}">Continuar</button></div></div>`}));
  return rows.sort((a,b)=>b.t-a.t).slice(0,6).map(r=>r.html).join("")}

    <button class="row" data-u="${u.id}"><span class="av">${u.id==="my"?"★":u.id.slice(1)}</span>

  if(!IN_CLAUDE){document.getElementById("bkSave").onclick=()=>{const b=new Blob([JSON.stringify(P,null,1)],{type:"application/json"});const x=document.createElement("a");x.href=URL.createObjectURL(b);x.download="shop-floor-english-progresso-"+dayKey()+".json";document.body.appendChild(x);x.click();setTimeout(()=>{URL.revokeObjectURL(x.href);x.remove()},500)};
  const bf=document.getElementById("bkFile");document.getElementById("bkLoad").onclick=()=>bf.click();
  bf.onchange=()=>{const f=bf.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);if(typeof o!=="object"||typeof o.xp!=="number")throw 0;
    P=merge(o);save();refreshStats();renderHome();toast("Progresso carregado")}).catch(()=>toast("Arquivo inválido"))};}
}

/* ---------- Bolhas ---------- */
function themBubble(en,pt){const d=document.createElement("div");d.className="msg them";
  d.innerHTML=`<div>${phHTML(en)}</div><div class="pt">${esc(pt||"")}</div><div class="acts">
   <button class="chip" data-a="play">${spkSVG()} Ouvir</button><button class="chip" data-a="slow">Devagar</button>${pt?`<button class="chip" data-a="pt">Tradução</button>`:""}<button class="chip" data-a="drill">Praticar</button></div>`;
  d.querySelector('[data-a="play"]').onclick=()=>speak(en);d.querySelector('[data-a="slow"]').onclick=()=>speak(en,true);
  d.querySelector('[data-a="drill"]').onclick=()=>openDrill(en,pt);
  const t=d.querySelector('[data-a="pt"]');if(t)t.onclick=()=>d.classList.toggle("showpt");return d}
function meBubble(text){const d=document.createElement("div");d.className="msg me";d.innerHTML=phHTML(text);return d}
function fbBox(sim,said,target){const fb=document.createElement("div");fb.className="fb";fb.innerHTML=gaugeHTML(sim)+(sim<.9?`<div style="margin-top:6px">Modelo: ${wordsHTML(said,target)}</div>`:"");return fb}

/* ---------- Prática livre de uma frase (fala quantas vezes quiser) ---------- */
function openDrill(target,pt){stopAll();const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<div class="sheet" role="dialog" aria-label="Praticar frase"><div class="card"><div class="kind">Repita quantas vezes quiser</div><div class="sent">${phHTML(target)}</div>${pt?`<div class="ptl">${esc(pt)}</div>`:""}
   <div class="listen"><button class="chip" data-p>${spkSVG()} Ouvir</button><button class="chip" data-s>Devagar</button></div><div class="dz"></div><div class="dres"></div>
   <button class="btn wide" data-x style="margin-top:12px">Pronto, voltar</button></div></div>`;
  document.body.appendChild(ov);document.body.classList.add("noscroll");
  const close=()=>{stopAll();ov.remove();document.body.classList.remove("noscroll")};
  ov.querySelector("[data-x]").onclick=close;ov.onclick=e=>{if(e.target===ov)close()};
  ov.querySelector("[data-p]").onclick=()=>speak(target);ov.querySelector("[data-s]").onclick=()=>speak(target,true);
  let best=0,n=0;
  speakZone(ov.querySelector(".dz"),cands=>{n++;let b=0,said=cands[0];for(const c of cands){const s=similarity(c,target);if(s>b){b=s;said=c}}
    if(b>=.8&&best<.8)addXP(3);best=Math.max(best,b);
    ov.querySelector(".dres").innerHTML=gaugeHTML(b,`Tentativa ${n}`)+`<div class="note" style="margin:6px 0">Você disse: “${esc(disp(said))}”</div>`+wordsHTML(said,target)+`<div class="note" style="margin-top:6px">Melhor até agora: ${deviation(best)} mm/s. Fale de novo ou volte quando quiser.</div>`});
}

/* ---------- Conversas roteirizadas ---------- */
function renderScenario(id,mode){view="scn";stopAll();top0();
  const s=SCENARIOS.find(x=>x.id===id);
  app.innerHTML=`<div class="sub"><button class="back">Voltar</button><div><h1>${esc(s.title)}</h1><div class="who">Com ${s.partner}, ${esc(s.role)} · ${s.level}</div></div></div>
   <div class="ctx">${esc(s.ctx)}</div><div class="chat" id="chat"></div><div id="turn"></div>`;
  app.querySelector(".back").onclick=()=>{stopAll();renderHome()};
  const chat=document.getElementById("chat"),turn=document.getElementById("turn");
  const saved=P.sprog[id];
  if(saved&&!mode){turn.appendChild(choiceBox(`Você já começou esta conversa (${saved.turns||0} falas suas). O que prefere?`,()=>renderScenario(id,"resume"),()=>renderScenario(id,"restart")));return}
  if(mode==="restart"){delete P.sprog[id];save()}
  let st=(mode==="resume"&&P.sprog[id])?P.sprog[id]:{node:s.start,log:[],turns:0,sims:[],xp:0,shown:false};
  const persist=()=>{st.at=Date.now();P.sprog[id]=st;save()};
  st.log.forEach(e=>{if(e.t==="them")chat.appendChild(themBubble(e.en,e.pt));else if(e.t==="me")chat.appendChild(meBubble(e.en));else if(e.t==="fb")chat.appendChild(fbBox(e.sim,e.said,e.target))});
  function show(nid,isNew){const n=s.nodes[nid];
    if(isNew){chat.appendChild(themBubble(n.say,n.pt));st.log.push({t:"them",en:n.say,pt:n.pt});st.node=nid;persist();speak(n.say)}
    turn.innerHTML=`<div class="turn"><h3>Sua vez: diga em inglês uma destas respostas</h3>
      ${n.replies.map((r,i)=>`<div class="opt" data-i="${i}"><span class="p">${esc(r.pt)}</span><span class="e">${phHTML(r.en)}</span>
       <span class="oa"><button class="chip" data-a="rev">Ver em inglês</button><button class="chip" data-a="hear">${spkSVG()} Ouvir modelo</button></span></div>`).join("")}
      <div id="sz"></div><div id="res"></div></div>`;
    turn.querySelectorAll(".opt").forEach(o=>{const r=n.replies[+o.dataset.i];
      o.querySelector('[data-a="rev"]').onclick=()=>o.classList.toggle("rev");
      o.querySelector('[data-a="hear"]').onclick=()=>{o.classList.add("rev");speak(r.en,true)}});
    const res=turn.querySelector("#res");let pending=null,tries=0;
    speakZone(turn.querySelector("#sz"),(cands,text)=>{tries++;
      const m=matchReply(cands,n.replies);
      if(!m||!m.ok){res.innerHTML=`<div class="warnbox">Entendi: “${esc(disp(text))}”. Isso ainda não responde ao ${s.partner}. ${m?`A mais próxima é: <b>${esc(disp(m.r.en))}</b>`:""} Fale de novo quando quiser.</div>${pending?`<div class="rowbtns" style="margin-top:8px"><button class="btn" id="cont">Continuar com a tentativa anterior</button></div>`:""}`;
        const cb=res.querySelector("#cont");if(cb)cb.onclick=()=>advance(pending);return}
      pending=m;
      res.innerHTML=`<div class="fb" style="max-width:none">${gaugeHTML(m.sim,`Tentativa ${tries}`)}<div class="note" style="margin:6px 0">Você disse: “${esc(disp(m.said))}”</div>${wordsHTML(m.said,m.r.en)}</div>
        <p class="note" style="text-align:center">Pode falar de novo quantas vezes quiser. Quando estiver satisfeito, siga.</p>
        <div class="rowbtns center"><button class="btn" id="cont">Continuar a conversa</button><button class="btn ghost" id="hearm">${spkSVG()} Ouvir modelo</button></div>`;
      res.querySelector("#cont").onclick=()=>advance(m);res.querySelector("#hearm").onclick=()=>speak(m.r.en,true);scrollEnd();
    },{hint:"Toque no microfone e responda. Você pode repetir quantas vezes quiser antes de seguir."});
    function advance(m){stopAll();st.turns++;st.sims.push(m.sim);const gain=m.sim>=.8?15:10;st.xp+=gain;addXP(gain);
      chat.appendChild(meBubble(m.said));chat.appendChild(fbBox(m.sim,m.said,m.r.en));
      st.log.push({t:"me",en:m.said},{t:"fb",sim:m.sim,said:m.said,target:m.r.en});
      turn.innerHTML="";toast(`+${gain} XP`);
      if(m.r.next==="END")finish();else{persist();show(m.r.next,true)}scrollEnd()}
    scrollEnd();}
  function finish(){const avg=st.sims.length?st.sims.reduce((a,b)=>a+b,0)/st.sims.length:0;addXP(30);st.xp+=30;
    P.scn[s.id]={done:true,best:Math.max((P.scn[s.id]&&P.scn[s.id].best)||0,Math.round(avg*100))};delete P.sprog[id];save();
    const dev=deviation(avg),[z,zl]=zoneOf(dev);
    turn.innerHTML=`<div class="turn sum"><h2>Roteiro concluído</h2><p class="note">Quer esticar o papo? Continue com o Claude no papel de ${s.partner}, sem roteiro e sem hora para acabar.</p>
     <div class="kpis"><div><b>${st.turns}</b><span>falas suas</span></div><div><b>${dev}</b><span>desvio médio (mm/s)</span></div><div><b>+${st.xp}</b><span>XP</span></div></div>
     <p><span class="zone ${z}">${zl}</span></p>
     <div class="rowbtns center" style="margin-top:14px"><button class="btn" id="toai">Continuar com a IA</button><button class="btn ghost" id="again">Repetir roteiro</button><button class="btn ghost" id="home2">Início</button></div></div>`;
    document.getElementById("again").onclick=()=>renderScenario(s.id,"restart");document.getElementById("home2").onclick=renderHome;
    document.getElementById("toai").onclick=()=>{const tr=st.log.filter(e=>e.t!=="fb").map(e=>(e.t==="them"?s.partner+": ":"Learner: ")+e.en).join("\n");
      newChat({area:"auto",tone:"auto",idea:`Continue this exact conversation after it ended. ${s.ctx} You are ${s.partner}, ${s.role} (describe the role in English). Earlier conversation:\n${tr}`,partner:s.partner,title:s.title+" (continuação)"})};
    scrollEnd()}
  if(mode==="resume"&&st.log.length)show(st.node,false);else show(st.node,true);
}

/* ---------- Vocabulário ---------- */
function renderUnit(id){view="unit";stopAll();top0();const u=getUnit(id);if(!u)return renderHome();
  const lp=P.lprog[id];
  app.innerHTML=`<div class="sub"><button class="back">Voltar</button><div><h1>${esc(u.title)}</h1><div class="who">${esc(u.d)}</div></div></div>
  ${lp?`<div class="rowbtns" style="margin:10px 0 6px"><button class="btn" id="goR">Continuar a lição (item ${lp.pos+1} de ${lp.items.length})</button><button class="btn ghost" id="goZ">Nova lição do zero</button></div>`:`<button class="btn wide" id="go" style="margin:10px 0 6px">Começar lição falada</button>`}
  <div class="terms">${u.terms.map((t,i)=>{const c=Math.min(3,P.words[u.id+":"+i]||0);return `<div class="term"><button class="iconbtn" data-i="${i}" aria-label="Ouvir ${esc(t[0])}">${spkSVG()}</button>
   <div class="tx"><b>${phHTML(t[0])}</b><div class="tp">${esc(t[1])}${t[2]?` · <i>${esc(disp(t[2]))}</i>`:""}</div></div>
   <div class="tcol"><div class="dots" title="${c} de 3 acertos">${[0,1,2].map(k=>`<i class="${k<c?"f":""}"></i>`).join("")}</div><button class="chip" data-d="${i}">Praticar</button>${u.id==="my"?`<button class="chip" data-x="${i}">Remover</button>`:""}</div></div>`}).join("")}</div>`;
  app.querySelector(".back").onclick=renderHome;
  app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const t=u.terms[+b.dataset.i];speak(t[0]).then(()=>{if(t[2])speak(t[2])})});
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const t=u.terms[+b.dataset.d];openDrill(t[0],t[1])});
  app.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{P.myterms.splice(+b.dataset.x,1);delete P.lprog.my;save();P.myterms.length?renderUnit("my"):renderHome()});
  const g=document.getElementById("go");if(g)g.onclick=()=>renderLesson(u.id,"restart");
  const gr=document.getElementById("goR");if(gr)gr.onclick=()=>renderLesson(u.id,"resume");
  const gz=document.getElementById("goZ");if(gz)gz.onclick=()=>renderLesson(u.id,"restart");
}
function renderLesson(uid,mode){view="lesson";stopAll();top0();const u=getUnit(uid);if(!u)return renderHome();
  let st;
  if(mode==="resume"&&P.lprog[uid])st=P.lprog[uid];
  else{const idx=u.terms.map((t,i)=>i).sort((a,b)=>(P.words[u.id+":"+a]||0)-(P.words[u.id+":"+b]||0)+(Math.random()-.5)*1.5).slice(0,8);
    const kinds=["repeat","sentence","recall"];
    const items=idx.map((i,k)=>{let kind=(P.words[u.id+":"+i]||0)===0&&k%3!==2?"repeat":kinds[(k+Math.floor(Math.random()*3))%3];if(kind==="sentence"&&!u.terms[i][2])kind="repeat";return {i,kind}});
    st={items,pos:0,okc:0,xp:0,sims:[]}}
  const persist=()=>{st.at=Date.now();P.lprog[uid]=st;save()};persist();
  function step(){if(st.pos>=st.items.length)return end();const it=st.items[st.pos],t=u.terms[it.i];
    const target=it.kind==="sentence"?t[2]:t[0];
    const head=it.kind==="repeat"?`<div class="kind">Ouça e repita</div><div class="big">${phHTML(t[0])}</div><div class="ptl">${esc(t[1])}</div>`
      :it.kind==="sentence"?`<div class="kind">Ouça e repita a frase</div><div class="sent">${phHTML(t[2])}</div><div class="ptl">${esc(t[3])}</div>`
      :`<div class="kind">Fale em inglês</div><div class="big">${esc(t[1])}</div>${t[3]?`<div class="ptl">Exemplo: ${esc(t[3])}</div>`:""}`;
    app.innerHTML=`<div class="lprog"><button class="back">Sair</button><div class="track"><i style="width:${st.pos/st.items.length*100}%"></i></div><span class="note">${st.pos+1}/${st.items.length}</span></div>
     <div class="card">${head}
      <div class="listen">${it.kind==="recall"?`<button class="chip" id="hint">Dica: ouvir</button><button class="chip" id="show">Mostrar resposta</button>`:`<button class="chip" id="pl">${spkSVG()} Ouvir</button><button class="chip" id="sl">Devagar</button>`}</div>
      <div id="reveal"></div><div id="sz"></div><div id="res"></div>
      <div class="rowbtns center" style="margin-top:12px"><button class="btn ghost" id="nx">Pular</button></div></div>`;
    app.querySelector(".back").onclick=()=>{stopAll();renderUnit(uid)};
    if(it.kind!=="recall"){document.getElementById("pl").onclick=()=>speak(target);document.getElementById("sl").onclick=()=>speak(target,true);speak(target)}
    else{document.getElementById("hint").onclick=()=>speak(t[0],true);document.getElementById("show").onclick=()=>{document.getElementById("reveal").innerHTML=`<div class="big" style="font-size:22px">${phHTML(t[0])}</div>`}}
    const res=document.getElementById("res"),nx=document.getElementById("nx");let tries=0,passed=false,best=0;
    nx.onclick=()=>{st.sims[st.pos]=best;st.pos++;persist();step()};
    speakZone(document.getElementById("sz"),(cands)=>{tries++;
      let b=0,said=cands[0];for(const c of cands){const s=similarity(c,target);if(s>b){b=s;said=c}}
      best=Math.max(best,b);
      res.innerHTML=gaugeHTML(b,`Tentativa ${tries}`)+`<div style="margin:8px 0 4px" class="note">Você disse: “${esc(disp(said))}”</div>`+wordsHTML(said,target)+
        `<div class="note" style="margin-top:8px">${b>=.5?"Boa! Pode repetir para melhorar ou seguir quando quiser.":"Ouça de novo e repita. Você decide quando seguir."}</div>`;
      if(b>=.5&&!passed){passed=true;const key=u.id+":"+it.i;P.words[key]=(P.words[key]||0)+1;st.okc++;const g=b>=.85?10:6;st.xp+=g;addXP(g);toast(`+${g} XP`);persist()}
      if(passed){nx.textContent="Continuar";nx.classList.remove("ghost");st.sims[st.pos]=best}
      if(it.kind==="recall"&&b<.5)speak(t[0],true);
    },{hint:"Toque no microfone e fale. Repita quantas vezes quiser."});}
  function end(){top0();addXP(10);st.xp+=10;delete P.lprog[uid];save();const ss=st.sims.filter(x=>typeof x==="number");const avg=ss.length?ss.reduce((a,b)=>a+b,0)/ss.length:0,dev=deviation(avg),[z,zl]=zoneOf(dev);
    app.innerHTML=`<div class="card sum"><h2>Lição concluída</h2><div class="kpis"><div><b>${st.okc}/${st.items.length}</b><span>acertos</span></div><div><b>${dev}</b><span>desvio médio (mm/s)</span></div><div><b>+${st.xp}</b><span>XP</span></div></div>
     <p><span class="zone ${z}">${zl}</span></p><div class="rowbtns center" style="margin-top:14px"><button class="btn" id="again">Outra lição</button><button class="btn ghost" id="bk">Ver termos</button></div></div>`;
    document.getElementById("again").onclick=()=>renderLesson(uid,"restart");document.getElementById("bk").onclick=()=>renderUnit(uid)}
  step();
}

   <div class="tcol"><button class="chip" data-d>Praticar</button>${mine?`<span class="chip">Salvo</span>`:`<button class="chip" data-v>Salvar</button>`}</div>`;

function deacc(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function localSearch(q){const nq=deacc(q.trim());if(nq.length<2)return {terms:[],scns:[]};
  const terms=[],seen=new Set();
  for(const u of getUnits())u.terms.forEach(t=>{const hay=deacc(t.join(" "));if(hay.includes(nq)&&!seen.has(t[0].toLowerCase())){seen.add(t[0].toLowerCase());terms.push({t,src:u.title})}});
  terms.sort((a,b)=>(deacc(a.t[0]).startsWith(nq)||deacc(a.t[1]).startsWith(nq)?0:1)-(deacc(b.t[0]).startsWith(nq)||deacc(b.t[1]).startsWith(nq)?0:1));
  const scns=SCENARIOS.filter(s=>{const hay=deacc([s.title,s.ctx,s.role,...Object.values(s.nodes).flatMap(n=>[n.say,n.pt])].join(" "));return hay.includes(nq)});
  if(!terms.length&&/^[a-z' -]+$/i.test(q.trim())){const words=q.trim().split(/\s+/);if(words.every(w=>phOf(phCore(w))))terms.push({t:[q.trim(),"(pronúncia)","",""],src:"Dicionário de pronúncia"})}
  return {terms:terms.slice(0,30),scns:scns.slice(0,8)}}

Return ONLY JSON:

Give 5 to 8 terms.`,{modelTier:"default"});
      if(!out||!Array.isArray(out.answer))throw {code:"bad"};
      const r={id:"r"+Date.now(),q,at:Date.now(),title:String(out.title||q),answer:out.answer.map(String).slice(0,6),terms:(Array.isArray(out.terms)?out.terms:[]).filter(x=>x&&x.en).slice(0,10),talk:String(out.talk||q)};

      const reply=String(out&&out.reply||"").trim();if(!reply)throw {code:"empty_completion"};
      if(kind==="first"){c.title=String(out.title_pt||c.title).slice(0,60);c.partner=c.partner||String(out.partner||"Alex");c.role_en=String(out.role_en||"");c.role_pt=String(out.role_pt||"");c.setting_pt=String(out.setting_pt||"");
        document.getElementById("ctitle").textContent=c.title;document.getElementById("cwho").textContent=c.partner+(c.role_pt?", "+c.role_pt:"");const cs=document.getElementById("cset");cs.textContent=c.setting_pt;cs.hidden=!c.setting_pt}
      else if(kind==="reply"){const last=c.hist[c.hist.length-1];if(last&&last.who==="me"){last.corr=String(out.correction||"").trim();last.fb=String(out.feedback_pt||"").trim();if(last.corr||last.fb)chat.appendChild(corrBox(last));addXP(last.corr?8:12)}}
      const hints=(Array.isArray(out.hints)?out.hints:[]).filter(h=>h&&h.en).slice(0,3).map(h=>({en:String(h.en),pt:String(h.pt||"")}));
      c.hist.push({who:"them",en:reply,pt:String(out.reply_pt||""),hints});c.updated=Date.now();save();
      chat.appendChild(themBubble(reply,out.reply_pt));speak(reply);openTurn();
    }catch(e){ty.remove();const w=document.createElement("div");w.className="warnbox";w.innerHTML=`${esc(aiErr(e&&e.code))} <button class="chip" id="retry">Tentar de novo</button>`;chat.appendChild(w);
      w.querySelector("#retry").onclick=()=>{w.remove();ask(kind)}}
    finally{busy=false;scrollEnd()}}
  function openTurn(){const last=c.hist[c.hist.length-1];const hints=(last&&last.hints)||[];
    turn.innerHTML=`<div class="turn"><h3>Sua vez: responda falando em inglês</h3>
      ${hints.length?`<button class="linkbtn" id="hb">Ideias de resposta</button><div id="hl" hidden>${hints.map((h,i)=>`<div class="opt rev"><span class="e">${phHTML(h.en)}</span><span class="p" style="font-weight:500;font-size:13.5px">${esc(h.pt)}</span><span class="oa"><button class="chip" data-h="${i}">${spkSVG()} Ouvir</button></span></div>`).join("")}</div>`:""}
      <div id="sz"></div>
      <div class="rowbtns center" style="margin-top:6px"><button class="btn ghost sm" id="sw">Mudar de assunto</button><button class="btn ghost sm" id="ps">Pausar e sair</button></div></div>`;
    const hb=document.getElementById("hb");if(hb)hb.onclick=()=>{const hl=document.getElementById("hl");hl.hidden=!hl.hidden};
    turn.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>speak(hints[+b.dataset.h].en,true));
    document.getElementById("ps").onclick=()=>{stopAll();toast("Conversa salva");renderHub()};
    document.getElementById("sw").onclick=()=>{if(busy)return;stopAll();ask("switch")};
    speakZone(turn.querySelector("#sz"),(cands,text)=>{if(busy)return;stopAll();c.hist.push({who:"me",en:text});c.updated=Date.now();save();chat.appendChild(meBubble(text));ask("reply")},{confirm:true});
    scrollEnd()}
  if(!IN_CLAUDE)return;
  if(!c.hist.length)ask("first");
  else if(c.hist[c.hist.length-1].who==="me")ask("reply");
  else openTurn();
}

refreshStats();renderHome();

</script>
