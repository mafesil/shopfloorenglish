<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Floor English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEEFEF; --surface:#FFFFFF; --surface2:#F6F6F6; --text:#23262A; --muted:#5F6368;
  --line:#D5D5D5; --wine:#861518; --wine-ink:#FFFFFF; --wine-soft:#F4E3E4; --graphite:#4E5255;
  --steel:#76787A; --ok:#2F7A5F; --ok-soft:#E1F0EA; --warn:#C9940A; --warn-soft:#FBF1D2;
  --me:#4E5255; --me-ink:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181A; --surface:#212427; --surface2:#2A2D31; --text:#ECEDEE; --muted:#A4A8AD;
    --line:#3A3E43; --wine:#C2454A; --wine-ink:#FFFFFF; --wine-soft:#3A2224; --graphite:#B8BCC0;
    --steel:#8E9296; --ok:#5DBB94; --ok-soft:#1F3229; --warn:#E8B93A; --warn-soft:#3A3220;
    --me:#3F4448; --me-ink:#F1F2F3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16181A; --surface:#212427; --surface2:#2A2D31; --text:#ECEDEE; --muted:#A4A8AD;
  --line:#3A3E43; --wine:#C2454A; --wine-ink:#FFFFFF; --wine-soft:#3A2224; --graphite:#B8BCC0;
  --steel:#8E9296; --ok:#5DBB94; --ok-soft:#1F3229; --warn:#E8B93A; --warn-soft:#3A3220;
  --me:#3F4448; --me-ink:#F1F2F3;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--wine);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 120px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:620px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:17px;background:none;border:0;padding:0}
.brand svg{flex:none}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0}
.stats{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:14px;font-weight:700}
.stat{display:flex;align-items:center;gap:5px}
.stat span.l{font-weight:500;color:var(--muted);font-size:12px}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:grid;place-items:center}

/* home */
.hello{padding:26px 0 8px}
.hello h1{font-size:clamp(24px,6vw,32px);line-height:1.15;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
.hello p{margin:0;color:var(--muted);max-width:52ch}
.goal{margin:18px 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.goal-row{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:8px}
.goal-row span:last-child{color:var(--muted);font-weight:500}
.track{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;background:var(--wine);border-radius:99px;transition:width .4s}
h2.sec{font-size:19px;margin:30px 0 4px;font-weight:800;letter-spacing:-.01em}
p.sec-d{margin:0 0 12px;color:var(--muted);font-size:14px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row .av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--surface2);border:2px solid var(--line);color:var(--graphite)}
.row.done .av{border-color:var(--wine);color:var(--wine)}
.row .tx{flex:1;min-width:0}
.row .tt{font-weight:700;font-size:15px}
.row .dd{font-size:13px;color:var(--muted);line-height:1.35}
.tag{flex:none;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag.ok{background:var(--wine);color:var(--wine-ink);border-color:var(--wine)}
.mini{height:6px;width:70px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line);flex:none}
.mini i{display:block;height:100%;background:var(--wine)}
.ai-cta{display:flex;gap:16px;align-items:center;padding:18px;border-radius:14px;background:var(--graphite);color:var(--surface);border:0;width:100%;text-align:left}
:root[data-theme="dark"] .ai-cta{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ai-cta{background:var(--surface2);color:var(--text);border:1px solid var(--line)}}
.ai-cta b{display:block;font-size:16px}
.ai-cta span{font-size:13.5px;opacity:.85}
.settings{margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:12px}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;font-weight:600}
select{font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text)}
.note{font-size:13px;color:var(--muted);line-height:1.45}

/* sub header */
.sub{display:flex;align-items:center;gap:10px;padding:16px 0 6px}
.back{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:600}
.sub h1{font-size:18px;margin:0;font-weight:800;line-height:1.25}
.sub .who{font-size:13px;color:var(--muted)}
.ctx{background:var(--surface);border-left:4px solid var(--wine);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px;color:var(--muted);margin:6px 0 14px}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;padding:6px 0 10px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:15.5px;line-height:1.45}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:5px}
.msg .pt{display:none;margin-top:6px;font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.msg.showpt .pt{display:block}
.msg .acts{display:flex;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.msg.me .chip{background:transparent;color:var(--me-ink);border-color:rgba(255,255,255,.35)}
.fb{align-self:flex-end;max-width:88%;font-size:13.5px;background:var(--warn-soft);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.fb b{font-weight:700}
.typing{align-self:flex-start;color:var(--muted);font-size:14px;padding:6px 2px}

/* turn panel */
.turn{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:6px}
.turn h3{font-size:14px;margin:0 0 10px;font-weight:700;color:var(--muted)}
.opt{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface2)}
.opt .p{font-weight:600;font-size:15px}
.opt .e{display:none;font-size:15px;color:var(--wine);font-weight:600}
.opt.rev .e{display:block}
.opt .oa{display:flex;gap:6px}
.miczone{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 4px}
.mic{width:78px;height:78px;border-radius:50%;border:0;background:var(--wine);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 0 rgba(134,21,24,.5)}
.mic[disabled]{opacity:.45;cursor:not-allowed}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(134,21,24,.45)}70%{box-shadow:0 0 0 18px rgba(134,21,24,0)}100%{box-shadow:0 0 0 0 rgba(134,21,24,0)}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none;outline:4px solid var(--warn)}}
.heard{min-height:22px;font-size:15px;color:var(--muted);text-align:center;max-width:46ch}
.typebox{display:none;gap:8px;width:100%}
.typebox.on{display:flex}
.typebox input{flex:1;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--text);min-width:0}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--wine);color:var(--wine-ink)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.wide{width:100%}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:4px}
.warnbox{background:var(--warn-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:8px}

/* deviation gauge */
.gauge{width:100%;margin:6px 0 2px}
.gauge .gt{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
.gauge .gt b{font-size:20px;font-weight:800}
.gbar{position:relative;height:14px;border-radius:4px;background:linear-gradient(90deg,var(--ok-soft) 0 40%,var(--warn-soft) 40% 50%,var(--wine-soft) 50% 100%);border:1px solid var(--line)}
.gbar .ln{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed}
.gbar .ln.a{left:40%;border-color:var(--warn)}
.gbar .ln.x{left:50%;border-color:var(--wine)}
.gbar .nd{position:absolute;top:-6px;width:4px;height:24px;border-radius:2px;background:var(--text);transform:translateX(-50%);transition:left .5s}
.gscale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.zone{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.zone.n{background:var(--ok-soft);color:var(--ok)}
.zone.a{background:var(--warn);color:#2a2000}
.zone.x{background:var(--wine);color:#fff}
.words{font-size:15.5px;line-height:1.7;text-align:center}
.words .w{padding:1px 3px;border-radius:4px}
.words .w.miss{background:var(--wine-soft);color:var(--wine);text-decoration:underline wavy;text-underline-offset:4px}

/* lesson */
.lprog{display:flex;align-items:center;gap:10px;margin:12px 0 18px}
.lprog .track{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center}
.card .kind{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px}
.card .big{font-size:clamp(24px,7vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:4px 0}
.card .sent{font-size:19px;font-weight:600;line-height:1.4;margin:4px 0}
.card .ptl{color:var(--muted);font-size:15px;margin-top:6px}
.listen{display:inline-flex;gap:8px;margin:12px 0 4px}
.terms{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin:10px 0 16px}
.term{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.term:first-child{border-top:0}
.term .tx{flex:1;min-width:0}
.term b{font-size:15px}
.term .tp{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--wine)}
.sum{text-align:center;padding:26px 10px}
.sum h2{font-size:24px;margin:0 0 6px;font-weight:800}
.sum .kpis{display:flex;justify-content:center;gap:26px;margin:18px 0}
.sum .kpis b{display:block;font-size:26px;font-weight:800}
.sum .kpis span{font-size:12.5px;color:var(--muted)}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.topic{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600}
.topic[aria-pressed="true"]{background:var(--wine);color:var(--wine-ink);border-color:var(--wine)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--graphite);color:var(--surface);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;transition:transform .3s;z-index:20}
:root[data-theme="dark"] .toast{background:var(--text);color:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:var(--text);color:var(--bg)}}
.toast.on{transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* v2: pronúncia, escolhas, busca e conversa ilimitada */
.phl{line-height:1.2}
.pw{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:0 1px 3px}
.pw small{font-size:.64em;font-weight:500;color:var(--muted);letter-spacing:.01em;line-height:1.25;white-space:nowrap;min-height:1.25em}
.msg.me .pw small{color:var(--me-ink);opacity:.75}
.words .pw{padding:1px 3px;border-radius:4px}
.words .pw.miss small{color:var(--wine)}
.big .pw small{font-size:.42em}
.sent .pw small,.bigsaid .pw small{font-size:.6em}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rowbtns.center{justify-content:center}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.choice{margin-top:10px}
.choice h3{color:var(--text);font-size:15px}
.list.pad{padding:4px 0}
.hub{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.hub:first-child{border-top:0}
.hub .tx{flex:1;min-width:180px;display:flex;flex-direction:column}
.hub .tx b{font-size:15px}
.hub .dd{font-size:13px;color:var(--muted)}
.ai-cta.alt{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.confirm{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.confirm[hidden]{display:none}
.term .tcol{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.term .src{color:var(--wine);font-weight:600}
.searchbar input,.askbox textarea,.askbox input{width:100%;font:inherit;font-size:15px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.searchbar{margin:8px 0 12px}
.askbox{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.askbox textarea{resize:vertical;min-height:80px}
.rescard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.rescard h3{margin:0 0 8px;font-size:17px}
.rescard p{margin:0 0 10px;font-size:15px}
.topic[disabled]{opacity:.5}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{width:100%;max-width:620px;max-height:calc(100vh - 32px);overflow:auto;border-radius:18px}
body.noscroll{overflow:hidden}
.opt.rev .e{display:block}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.msg .acts,.opt .oa,.listen{flex-wrap:wrap}

</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="brand" id="homeBtn" aria-label="Início">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="0" y="0" width="34" height="34" rx="9" fill="var(--wine)"/><path d="M4 18 L8 18 L10 11 L13 25 L16 7 L19 27 L22 13 L24 18 L30 18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Shop Floor English<small>inglês falado para manutenção</small></span>
  </button>
  <div class="stats">
    <div class="stat" title="Dias seguidos">🔥 <span id="stStreak">0</span></div>
    <div class="stat" title="Pontos de experiência"><span id="stXp">0</span> <span class="l">XP</span></div>
  </div>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   BANCO DE DADOS – CONVERSAS (diálogos ramificados)
   Cada nó: say (fala do parceiro), pt, replies[]
   Cada resposta: en (modelo), pt (o que dizer), keys (palavras-chave; "a|b" = alternativas), next
   ========================================================= */
const SCENARIOS = [
{ id:"handover", title:"Passagem de turno", partner:"Mike", role:"mecânico do turno da noite", level:"Básico",
  ctx:"Você chega de manhã. O mecânico da noite conta o que aconteceu com uma decanter durante o turno.",
  start:"n1", nodes:{
  n1:{say:"Morning! Long night here. Decanter number two tripped twice on high vibration.",pt:"Bom dia! Noite longa aqui. A decanter número dois desarmou duas vezes por vibração alta.",
    replies:[
     {en:"Good morning. What time did it trip?",pt:"Bom dia. A que horas ela desarmou?",keys:["what time","trip"],next:"n2"},
     {en:"Good morning. Did you check the bearing temperature?",pt:"Bom dia. Você verificou a temperatura do mancal?",keys:["check","bearing","temperature"],next:"n3"}]},
  n2:{say:"The first time at around two a.m., and again at four thirty. Both times right after a restart.",pt:"A primeira vez por volta das duas da manhã, e de novo às quatro e meia. As duas vezes logo depois de uma partida.",
    replies:[
     {en:"Okay. Was the machine cleaned before the restart?",pt:"Certo. A máquina foi limpa antes da partida?",keys:["cleaned|clean|washed","restart|start"],next:"n4"},
     {en:"Did you check the bearing temperature?",pt:"Você verificou a temperatura do mancal?",keys:["check","bearing","temperature"],next:"n3"}]},
  n3:{say:"Yes. The solids side bearing was hot, about ninety degrees. The liquid side was normal.",pt:"Sim. O mancal do lado dos sólidos estava quente, uns noventa graus. O lado dos líquidos estava normal.",
    replies:[
     {en:"Did you grease the bearings?",pt:"Você lubrificou os mancais?",keys:["grease|lubricate","bearing"],next:"n5"},
     {en:"That's too hot. We need to keep an eye on it.",pt:"Está quente demais. Precisamos ficar de olho nele.",keys:["too hot|hot","keep an eye"],next:"n5"}]},
  n4:{say:"Yes, we ran the cleaning cycle, but the water wasn't very hot.",pt:"Sim, rodamos o ciclo de limpeza, mas a água não estava muito quente.",
    replies:[
     {en:"That explains it. There may be product stuck inside the bowl.",pt:"Isso explica. Pode haver produto grudado dentro do cilindro.",keys:["stuck|build up|buildup","bowl|inside"],next:"n6"},
     {en:"Did you check the bearing temperature?",pt:"Você verificou a temperatura do mancal?",keys:["check","bearing","temperature"],next:"n3"}]},
  n5:{say:"I greased them at midnight, forty grams each, like the plan says. Is that right?",pt:"Eu lubrifiquei à meia-noite, quarenta gramas cada, como o plano manda. Está certo?",
    replies:[
     {en:"Yes, that's right. Please write it in the log.",pt:"Sim, está certo. Por favor, anote no registro.",keys:["right|correct","log|write"],next:"n6"},
     {en:"Yes, but don't add more grease today.",pt:"Sim, mas não coloque mais graxa hoje.",keys:["more grease|more","today"],next:"n6"}]},
  n6:{say:"Got it. So what do you want to do with the machine now?",pt:"Entendi. Então, o que você quer fazer com a máquina agora?",
    replies:[
     {en:"Let's keep it running and monitor the trend online.",pt:"Vamos mantê-la rodando e acompanhar a tendência online.",keys:["running|run","monitor|watch","trend|online"],next:"n7"},
     {en:"Let's shut it down and inspect the bowl.",pt:"Vamos parar a máquina e inspecionar o cilindro.",keys:["shut|stop","inspect|check","bowl"],next:"n8"}]},
  n7:{say:"Sounds good. If it goes over the alarm again, I'll call you. Have a good shift!",pt:"Parece bom. Se passar do alarme de novo, eu te ligo. Bom turno!",
    replies:[{en:"Thanks, Mike. Get some rest!",pt:"Obrigado, Mike. Vá descansar!",keys:["thank","rest"],next:"END"}]},
  n8:{say:"Okay. I'll tell the production supervisor and lock it out. Have a good shift!",pt:"Certo. Vou avisar o supervisor da produção e bloquear a máquina. Bom turno!",
    replies:[{en:"Thanks, Mike. Get some rest!",pt:"Obrigado, Mike. Vá descansar!",keys:["thank","rest"],next:"END"}]}
}},
{ id:"manager", cat:"gratt", title:"Alarme de vibração: reportar ao gerente", partner:"Sarah", role:"gerente da planta", level:"Intermediário",
  ctx:"O GRATTscan disparou alarme na decanter da linha de sangue. Explique a situação para a gerente e recomende a ação.",
  start:"n1", nodes:{
  n1:{say:"Hi, I got an email about a vibration alarm on the blood line decanter. How bad is it?",pt:"Oi, recebi um e-mail sobre um alarme de vibração na decanter da linha de sangue. Quão grave é?",
    replies:[
     {en:"It's serious. The liquid side bearing is above the alarm almost all the time.",pt:"É sério. O mancal do lado dos líquidos fica acima do alarme quase o tempo todo.",keys:["serious|critical","bearing","alarm"],next:"n2"},
     {en:"It's critical. The axial vibration on the solids side is about seventy millimeters per second.",pt:"É crítico. A vibração axial no lado dos sólidos está em uns setenta milímetros por segundo.",keys:["critical|serious","axial","70|seventy"],next:"n3"}]},
  n2:{say:"What does that mean in practice? Can it break down?",pt:"O que isso significa na prática? Ela pode quebrar?",
    replies:[
     {en:"Yes. The bearing is damaged and it can fail at any time.",pt:"Sim. O rolamento está danificado e pode falhar a qualquer momento.",keys:["damaged|bad","fail|break","any time|anytime"],next:"n4"},
     {en:"The acceleration is very high, which points to a bearing defect.",pt:"A aceleração está muito alta, o que indica defeito no rolamento.",keys:["acceleration","bearing","defect|damage|problem"],next:"n4"}]},
  n3:{say:"Seventy? What's the limit?",pt:"Setenta? Qual é o limite?",
    replies:[
     {en:"The alarm is twenty five millimeters per second, so it's almost three times the limit.",pt:"O alarme é vinte e cinco milímetros por segundo, então está quase três vezes o limite.",keys:["alarm","25|twenty five","three times|3 times"],next:"n2"}]},
  n4:{say:"Okay. What do you recommend?",pt:"Certo. O que você recomenda?",
    replies:[
     {en:"We recommend an urgent overhaul in our workshop, with a loan machine.",pt:"Recomendamos uma restauração urgente na nossa oficina, com máquina de empréstimo.",keys:["overhaul|restoration|repair","workshop|shop","loan|spare|backup"],next:"n5"},
     {en:"We should replace the bearings and balance the bowl as soon as possible.",pt:"Devemos trocar os rolamentos e balancear o cilindro o quanto antes.",keys:["replace|change","bearing","balance"],next:"n5"}]},
  n5:{say:"How long will production be affected?",pt:"Por quanto tempo a produção será afetada?",
    replies:[
     {en:"Production won't stop. We'll install a loan machine during the service.",pt:"A produção não vai parar. Vamos instalar uma máquina de empréstimo durante o serviço.",keys:["not stop|won't stop|will not stop","loan|backup|spare","install"],next:"n6"},
     {en:"Only a few hours, just to swap the machines.",pt:"Só algumas horas, apenas para trocar as máquinas.",keys:["few hours|hours","swap|change|replace"],next:"n6"}]},
  n6:{say:"Fine. Send me the quote and the schedule by tomorrow.",pt:"Ótimo. Me mande o orçamento e o cronograma até amanhã.",
    replies:[{en:"Sure. I'll send them by tomorrow morning.",pt:"Claro. Envio até amanhã de manhã.",keys:["send","tomorrow"],next:"END"}]}
}},
{ id:"spectrum", title:"Análise de espectro com o fabricante", partner:"Ana", role:"engenheira de vibração do fabricante", level:"Avançado",
  ctx:"Você enviou um espectro de vibração para o fabricante. Em uma chamada, a engenheira revisa os dados com você.",
  start:"n1", nodes:{
  n1:{say:"I've looked at the spectrum you sent. What's the running speed of the bowl?",pt:"Olhei o espectro que você mandou. Qual é a rotação de trabalho do cilindro?",
    replies:[
     {en:"It runs at about two thousand seven hundred rpm.",pt:"Ela roda a uns dois mil e setecentos rpm.",keys:["2700|2726|two thousand seven hundred","rpm|r p m"],next:"n2"},
     {en:"I'm not sure. Let me check the nameplate.",pt:"Não tenho certeza. Deixa eu verificar a placa de identificação.",keys:["not sure","nameplate|name plate|check"],next:"n1b"}]},
  n1b:{say:"No problem. It should be on the nameplate or in the manual.",pt:"Sem problema. Deve estar na placa ou no manual.",
    replies:[{en:"Okay, it's two thousand seven hundred twenty six rpm.",pt:"Certo, são dois mil setecentos e vinte e seis rpm.",keys:["2726|2700|two thousand seven hundred"],next:"n2"}]},
  n2:{say:"So one times running speed is about forty five hertz. Do you see a high peak there?",pt:"Então uma vez a rotação é cerca de quarenta e cinco hertz. Você vê um pico alto ali?",
    replies:[
     {en:"Yes, there's a high peak at one times, mainly in the radial direction.",pt:"Sim, tem um pico alto em uma vez a rotação, principalmente na direção radial.",keys:["peak","1 times|one times|1x|running speed","radial"],next:"n3"},
     {en:"Not really. The highest peak is in the axial direction.",pt:"Na verdade, não. O maior pico está na direção axial.",keys:["axial","peak"],next:"n4"}]},
  n3:{say:"That's a classic sign of unbalance. Was the bowl cleaned properly?",pt:"Esse é um sinal clássico de desbalanceamento. O cilindro foi limpo corretamente?",
    replies:[
     {en:"Probably not. The cleaning water is only about fifty five degrees.",pt:"Provavelmente não. A água de limpeza está só a uns cinquenta e cinco graus.",keys:["probably not|not","water","55|fifty five|degrees"],next:"n5"},
     {en:"Yes, but the scroll may be worn.",pt:"Sim, mas o caracol pode estar desgastado.",keys:["scroll|conveyor","worn|wear"],next:"n5"}]},
  n4:{say:"High axial vibration at one and two times often means misalignment. Did you check the alignment?",pt:"Vibração axial alta em uma e duas vezes a rotação geralmente indica desalinhamento. Vocês verificaram o alinhamento?",
    replies:[
     {en:"Not yet. We'll check it with the laser tool.",pt:"Ainda não. Vamos verificar com o alinhador a laser.",keys:["not yet","laser","check"],next:"n5"},
     {en:"Could it be pipe strain from the inlet hose?",pt:"Pode ser esforço de tubulação vindo da mangueira de entrada?",keys:["pipe strain|pipe|strain","hose|inlet"],next:"n5"}]},
  n5:{say:"Okay. What about the high frequency range? Any bearing frequencies?",pt:"Certo. E a faixa de alta frequência? Alguma frequência de rolamento?",
    replies:[
     {en:"Yes, we see the outer race frequency with sidebands.",pt:"Sim, vemos a frequência da pista externa com bandas laterais.",keys:["outer race","sideband|side band"],next:"n6"},
     {en:"The envelope spectrum shows bearing defect frequencies.",pt:"O espectro de envelope mostra frequências de defeito de rolamento.",keys:["envelope","bearing","defect|fault"],next:"n6"}]},
  n6:{say:"Then the bearing is at a late stage. I'd plan a replacement within two weeks.",pt:"Então o rolamento está em estágio avançado. Eu planejaria a troca em até duas semanas.",
    replies:[{en:"I agree. We'll plan the overhaul and send you the report.",pt:"Concordo. Vamos programar a restauração e te enviar o relatório.",keys:["agree","plan|schedule","report"],next:"END"}]}
}},
{ id:"lube", title:"Treinando um mecânico novo em lubrificação", partner:"Luke", role:"mecânico recém-contratado", level:"Básico",
  ctx:"Um mecânico novo quer saber como lubrificar as decanters. Explique a rotina do plano de lubrificação.",
  start:"n1", nodes:{
  n1:{say:"Hey, I'm new here. They told me to grease the decanters. How often should I do it?",pt:"Oi, sou novo aqui. Me disseram para engraxar as decanters. Com que frequência devo fazer isso?",
    replies:[
     {en:"Every forty eight hours on the main bearings.",pt:"A cada quarenta e oito horas nos mancais principais.",keys:["48|forty eight","hours","bearing"],next:"n2"},
     {en:"Every two days. I'll show you the plan.",pt:"A cada dois dias. Vou te mostrar o plano.",keys:["two days|2 days","plan|show"],next:"n2"}]},
  n2:{say:"And how much grease? I usually just pump until it comes out.",pt:"E quanta graxa? Eu costumo bombear até sair.",
    replies:[
     {en:"No, don't do that. Too much grease causes overheating.",pt:"Não, não faça isso. Graxa demais causa superaquecimento.",keys:["too much","overheat|hot|heat"],next:"n3"},
     {en:"Forty grams per bearing on this model.",pt:"Quarenta gramas por mancal neste modelo.",keys:["40|forty","gram"],next:"n3"}]},
  n3:{say:"Okay. Which grease do we use?",pt:"Certo. Qual graxa usamos?",
    replies:[
     {en:"Use the high temperature synthetic grease from the plan. Never mix brands.",pt:"Use a graxa sintética de alta temperatura do plano. Nunca misture marcas.",keys:["synthetic|high temperature","never mix|mix"],next:"n4"},
     {en:"Only the grease written in the lubrication plan.",pt:"Só a graxa que está escrita no plano de lubrificação.",keys:["only","plan|lubrication"],next:"n4"}]},
  n4:{say:"Should I clean the grease nipple first?",pt:"Devo limpar a graxeira antes?",
    replies:[
     {en:"Yes, always wipe the nipple before you grease it.",pt:"Sim, sempre limpe a graxeira antes de engraxar.",keys:["always|yes","wipe|clean","nipple|fitting"],next:"n5"},
     {en:"Yes, to keep dirt out of the bearing.",pt:"Sim, para não entrar sujeira no rolamento.",keys:["dirt|contamination","bearing"],next:"n5"}]},
  n5:{say:"Great. Anything else?",pt:"Ótimo. Mais alguma coisa?",
    replies:[
     {en:"Write every application in the lubrication log.",pt:"Anote cada aplicação no registro de lubrificação.",keys:["write|record|register","log|sheet"],next:"n6"},
     {en:"If the temperature goes up after greasing, call me.",pt:"Se a temperatura subir depois de engraxar, me chame.",keys:["temperature","goes up|rises|up","call"],next:"n6"}]},
  n6:{say:"Got it. Thanks for the help!",pt:"Entendi. Obrigado pela ajuda!",
    replies:[{en:"You're welcome. Ask me anytime.",pt:"De nada. Pode me perguntar quando quiser.",keys:["welcome","anytime|any time|ask"],next:"END"}]}
}},
{ id:"loto", title:"Segurança: bloqueio antes da manutenção", partner:"Rita", role:"técnica de segurança", level:"Intermediário",
  ctx:"Antes de abrir uma decanter, a técnica de segurança pede para você explicar o procedimento de bloqueio (lockout/tagout).",
  start:"n1", nodes:{
  n1:{say:"Before you open the decanter, walk me through your lockout procedure.",pt:"Antes de abrir a decanter, me explique passo a passo seu procedimento de bloqueio.",
    replies:[
     {en:"First, we stop the machine and wait for the bowl to come to a complete stop.",pt:"Primeiro, paramos a máquina e esperamos o cilindro parar completamente.",keys:["stop","wait","complete|completely|fully"],next:"n2"},
     {en:"We turn off the main switch and put our padlock on it.",pt:"Desligamos a chave geral e colocamos nosso cadeado nela.",keys:["main switch|turn off|switch","padlock|lock"],next:"n3"}]},
  n2:{say:"Good. Why is waiting so important on a decanter?",pt:"Bom. Por que esperar é tão importante em uma decanter?",
    replies:[
     {en:"Because the bowl coasts down for a long time and it's very dangerous.",pt:"Porque o cilindro leva muito tempo para desacelerar e é muito perigoso.",keys:["coast|spins|slow","long time|long","danger"],next:"n3"}]},
  n3:{say:"Right. After you lock the switch, what's next?",pt:"Certo. Depois de bloquear a chave, qual o próximo passo?",
    replies:[
     {en:"We try to start the machine to verify zero energy.",pt:"Tentamos partir a máquina para confirmar energia zero.",keys:["try","start","verify|zero|confirm"],next:"n4"},
     {en:"We hang a tag with our name and the date.",pt:"Penduramos uma etiqueta com nosso nome e a data.",keys:["tag","name","date"],next:"n4"}]},
  n4:{say:"And what about the feed pump and the steam?",pt:"E a bomba de alimentação e o vapor?",
    replies:[
     {en:"We close and lock the valves and isolate the feed pump too.",pt:"Fechamos e bloqueamos as válvulas e isolamos a bomba de alimentação também.",keys:["close|lock","valve","isolate|pump"],next:"n5"}]},
  n5:{say:"Excellent. And who can remove your lock?",pt:"Excelente. E quem pode remover o seu cadeado?",
    replies:[{en:"Only me. Nobody else can remove my lock.",pt:"Só eu. Ninguém mais pode remover meu cadeado.",keys:["only me|only i","nobody|no one"],next:"END"}]}
}},
{ id:"align", title:"Alinhamento a laser após troca do motor", partner:"Tom", role:"colega da manutenção", level:"Intermediário",
  ctx:"O motor novo foi instalado. Você e um colega fazem o alinhamento e a checagem de pé manco.",
  start:"n1", nodes:{
  n1:{say:"The new motor is in place. Are we doing the alignment with dial indicators or with the laser?",pt:"O motor novo está no lugar. Vamos alinhar com relógio comparador ou com o laser?",
    replies:[
     {en:"With the laser. It's faster and more accurate.",pt:"Com o laser. É mais rápido e mais preciso.",keys:["laser","faster|accurate|precise"],next:"n2"},
     {en:"Let's use the laser, but first check for soft foot.",pt:"Vamos usar o laser, mas antes verificar o pé manco.",keys:["laser","soft foot"],next:"n3"}]},
  n2:{say:"Okay. Should we check soft foot first?",pt:"Certo. Devemos verificar o pé manco antes?",
    replies:[
     {en:"Yes, always. Loosen each bolt and measure the change.",pt:"Sim, sempre. Afrouxe cada parafuso e meça a variação.",keys:["loosen","bolt","measure"],next:"n3"}]},
  n3:{say:"I found zero point fifteen millimeters on the rear foot.",pt:"Encontrei zero vírgula quinze milímetros no pé traseiro.",
    replies:[
     {en:"Add a shim under that foot and check again.",pt:"Coloque um calço embaixo desse pé e verifique de novo.",keys:["shim","foot","again|check"],next:"n4"}]},
  n4:{say:"Done. Now the offset is fine, but the angle is out of tolerance.",pt:"Feito. Agora o deslocamento paralelo está bom, mas o angular está fora da tolerância.",
    replies:[
     {en:"Move the rear of the motor and tighten the bolts in sequence.",pt:"Mova a traseira do motor e aperte os parafusos em sequência.",keys:["move","tighten","bolt"],next:"n5"},
     {en:"Let's correct the vertical first, then the horizontal.",pt:"Vamos corrigir primeiro o vertical, depois o horizontal.",keys:["vertical","horizontal"],next:"n5"}]},
  n5:{say:"Now everything is within tolerance. Shall we start it up?",pt:"Agora está tudo dentro da tolerância. Vamos partir?",
    replies:[
     {en:"Yes. Then we take a baseline vibration reading.",pt:"Sim. Depois fazemos uma leitura de vibração de referência.",keys:["baseline|reference","reading|measurement"],next:"END"},
     {en:"Not yet. First put the coupling guard back on.",pt:"Ainda não. Primeiro recoloque a proteção do acoplamento.",keys:["not yet","guard","coupling"],next:"n6"}]},
  n6:{say:"Good call. The guard is on. Starting up now.",pt:"Bem lembrado. A proteção está no lugar. Partindo agora.",
    replies:[{en:"Great. Let's take a baseline vibration reading.",pt:"Ótimo. Vamos fazer uma leitura de vibração de referência.",keys:["baseline|reference","reading|vibration"],next:"END"}]}
}},
{ id:"parts", title:"Pedido de peças ao fornecedor", partner:"Jenny", role:"vendedora de peças", level:"Básico",
  ctx:"Você liga para o fornecedor para pedir um orçamento de rolamentos e vedações para uma decanter.",
  start:"n1", nodes:{
  n1:{say:"Good afternoon, parts department, this is Jenny. How can I help you?",pt:"Boa tarde, departamento de peças, aqui é a Jenny. Como posso ajudar?",
    replies:[
     {en:"Hi Jenny. I need a quote for a bearing kit for a decanter.",pt:"Oi, Jenny. Preciso de um orçamento de um kit de rolamentos para uma decanter.",keys:["quote|price","bearing","decanter|centrifuge"],next:"n2"},
     {en:"Hello. I'd like to order spare parts for a decanter.",pt:"Olá. Eu gostaria de pedir peças de reposição para uma decanter.",keys:["order|buy","spare parts|parts"],next:"n2"}]},
  n2:{say:"Sure. Do you have the serial number of the machine?",pt:"Claro. Você tem o número de série da máquina?",
    replies:[
     {en:"Yes, I'll send you the serial number by email.",pt:"Sim, vou te enviar o número de série por e-mail.",keys:["serial number|serial","email|e mail|send"],next:"n3"},
     {en:"Yes. It's on the nameplate. Just a moment.",pt:"Sim. Está na placa de identificação. Só um momento.",keys:["nameplate|name plate|plate","moment|second"],next:"n3"}]},
  n3:{say:"Thank you. Do you need the seals and the feed tube as well?",pt:"Obrigada. Você precisa das vedações e do tubo de alimentação também?",
    replies:[
     {en:"Yes, please include the seals, but not the feed tube.",pt:"Sim, por favor inclua as vedações, mas não o tubo de alimentação.",keys:["include","seal","not"],next:"n4"},
     {en:"Only the bearings and the seals, please.",pt:"Só os rolamentos e as vedações, por favor.",keys:["only|just","bearing","seal"],next:"n4"}]},
  n4:{say:"No problem. The bearings are in stock, but the seals have a lead time of ten days.",pt:"Sem problema. Os rolamentos estão em estoque, mas as vedações têm prazo de entrega de dez dias.",
    replies:[
     {en:"That's too long. Is there any way to expedite it?",pt:"É muito tempo. Tem algum jeito de acelerar?",keys:["too long|long","expedite|faster|speed up|sooner"],next:"n5"},
     {en:"That's fine. Please send me the quote by email.",pt:"Tudo bem. Por favor, me mande o orçamento por e-mail.",keys:["fine|ok|okay","quote","email|e mail"],next:"n6"}]},
  n5:{say:"I can check air freight. It would cost a bit more.",pt:"Posso verificar frete aéreo. Custaria um pouco mais.",
    replies:[{en:"Okay. Please include both options in the quote.",pt:"Certo. Por favor, inclua as duas opções no orçamento.",keys:["both|two","option","quote"],next:"n6"}]},
  n6:{say:"Perfect. I'll send it today. Anything else?",pt:"Perfeito. Envio hoje. Mais alguma coisa?",
    replies:[{en:"No, that's all. Thank you very much.",pt:"Não, é só isso. Muito obrigado.",keys:["that's all|that is all|all","thank"],next:"END"}]}
}},
{ id:"sensors", cat:"gratt", title:"Suporte do monitoramento online", partner:"Raj", role:"engenheiro de suporte IoT", level:"Intermediário",
  ctx:"Você fala com o suporte da plataforma de monitoramento sobre sensores novos, orientação dos eixos e limites de alarme.",
  start:"n1", nodes:{
  n1:{say:"Hi, I see two new sensors on your account. Are they both on the same machine?",pt:"Oi, vejo dois sensores novos na sua conta. Os dois estão na mesma máquina?",
    replies:[
     {en:"Yes. One on the solids side bearing and one on the liquid side bearing.",pt:"Sim. Um no mancal do lado dos sólidos e outro no mancal do lado dos líquidos.",keys:["solids|solid","liquid","bearing"],next:"n2"}]},
  n2:{say:"Great. How are they mounted? Magnet or stud?",pt:"Ótimo. Como estão fixados? Ímã ou prisioneiro (rosca)?",
    replies:[
     {en:"They're stud mounted, directly on the bearing housing.",pt:"Estão fixados com prisioneiro, direto na caixa do mancal.",keys:["stud","housing|bearing"],next:"n3"},
     {en:"With a magnet for now. We'll drill and tap later.",pt:"Com ímã por enquanto. Vamos furar e rosquear depois.",keys:["magnet","drill|tap|later"],next:"n3"}]},
  n3:{say:"Which way is the axial axis pointing? The data shows very high axial vibration.",pt:"Para que lado aponta o eixo axial? Os dados mostram vibração axial muito alta.",
    replies:[
     {en:"Good question. We'll check the sensor orientation on site.",pt:"Boa pergunta. Vamos verificar a orientação do sensor no local.",keys:["check","orientation|direction"],next:"n4"},
     {en:"The Y axis is parallel to the shaft, so it's the axial direction.",pt:"O eixo Y está paralelo ao eixo da máquina, então é a direção axial.",keys:["y|why","parallel","shaft"],next:"n4"}]},
  n4:{say:"Okay. Also, the asset name and the tag in the platform are wrong.",pt:"Certo. Além disso, o nome do ativo e a TAG na plataforma estão errados.",
    replies:[
     {en:"I know. We'll update the tag and the sensor names this week.",pt:"Eu sei. Vamos atualizar a TAG e os nomes dos sensores esta semana.",keys:["update|change|fix","tag","name"],next:"n5"}]},
  n5:{say:"Perfect. Do you want me to change the alarm limits too?",pt:"Perfeito. Quer que eu altere os limites de alarme também?",
    replies:[
     {en:"Yes, please set the alert to twenty and the alarm to twenty five millimeters per second.",pt:"Sim, por favor ajuste o alerta para vinte e o alarme para vinte e cinco milímetros por segundo.",keys:["alert","20|twenty","alarm","25|twenty five"],next:"n6"},
     {en:"No, keep the default limits for now.",pt:"Não, mantenha os limites padrão por enquanto.",keys:["keep","default"],next:"n6"}]},
  n6:{say:"Done. You'll get an email notification for every alarm.",pt:"Feito. Você vai receber uma notificação por e-mail a cada alarme.",
    replies:[{en:"Thanks, Raj. That's very helpful.",pt:"Obrigado, Raj. Ajudou muito.",keys:["thank","helpful|help"],next:"END"}]}
}},

/* ---------- Situações GRATT ---------- */
{ id:"visit", cat:"gratt", title:"Visita inicial: cadastro e baseline", partner:"David", role:"coordenador de manutenção do cliente", level:"Intermediário",
  ctx:"Primeiro dia do contrato. Explique ao coordenador do cliente o que a equipe GRATT vai fazer na visita inicial.",
  start:"n1", nodes:{
  n1:{say:"Welcome! So, what's the plan for these two days?",pt:"Bem-vindos! Então, qual é o plano para esses dois dias?",
    replies:[
     {en:"First, we'll register all the decanters and measure the vibration on each machine.",pt:"Primeiro, vamos cadastrar todas as decanters e medir a vibração de cada máquina.",keys:["register|list","decanter|machine","measure|vibration"],next:"n2"},
     {en:"We want to see the real condition of the machines and the process.",pt:"Queremos ver a condição real das máquinas e do processo.",keys:["condition","machine","process"],next:"n2"}]},
  n2:{say:"Why do you need to measure everything now? The machines are running fine.",pt:"Por que vocês precisam medir tudo agora? As máquinas estão rodando bem.",
    replies:[
     {en:"This is our baseline. We'll compare every report with it.",pt:"Essa é a nossa referência. Vamos comparar todos os relatórios com ela.",keys:["baseline|reference","compare"],next:"n3"},
     {en:"Some machines may have hidden bearing problems.",pt:"Algumas máquinas podem ter problemas de rolamento escondidos.",keys:["hidden|problem","bearing"],next:"n3"}]},
  n3:{say:"Okay. Two of the machines are stopped today. Is that a problem?",pt:"Certo. Duas máquinas estão paradas hoje. Isso é um problema?",
    replies:[
     {en:"No problem. We'll register them now and measure them when they're back.",pt:"Sem problema. Vamos cadastrá-las agora e medir quando voltarem.",keys:["register","measure","back|return"],next:"n4"}]},
  n4:{say:"By the way, two decanters have the same tag number.",pt:"Aliás, duas decanters têm o mesmo número de TAG.",
    replies:[
     {en:"We need to fix that. Duplicate tags cause mistakes in work orders.",pt:"Precisamos corrigir isso. TAG repetida causa erro nas ordens de serviço.",keys:["fix|change|correct","duplicate|same","work order|work orders|mistake|mistakes"],next:"n5"},
     {en:"Let's give each machine a unique tag before we set up the sensors.",pt:"Vamos dar uma TAG única para cada máquina antes de configurar os sensores.",keys:["unique|different","tag","sensor|sensors"],next:"n5"}]},
  n5:{say:"Makes sense. When will we get your report?",pt:"Faz sentido. Quando vamos receber o relatório de vocês?",
    replies:[{en:"Within a week, with our findings and an action plan.",pt:"Em até uma semana, com as nossas constatações e um plano de ação.",keys:["week","action plan|plan"],next:"END"}]}
}},
{ id:"pickup", cat:"gratt", title:"Coleta da máquina e máquina de empréstimo", partner:"Mark", role:"supervisor de produção", level:"Intermediário",
  ctx:"A decanter vai para restauração na oficina da GRATT. Combine com o supervisor a troca pela máquina de empréstimo.",
  start:"n1", nodes:{
  n1:{say:"I heard you're taking our decanter to the workshop. How long will we be without it?",pt:"Soube que vocês vão levar nossa decanter para a oficina. Quanto tempo vamos ficar sem ela?",
    replies:[
     {en:"You won't be without a machine. We'll bring a loan decanter.",pt:"Vocês não vão ficar sem máquina. Vamos trazer uma decanter de empréstimo.",keys:["loan|backup|spare","decanter|machine"],next:"n2"},
     {en:"Only during the swap. It usually takes one shift.",pt:"Só durante a troca. Normalmente leva um turno.",keys:["swap|change","shift|hours"],next:"n2"}]},
  n2:{say:"Good. When can you do the swap?",pt:"Ótimo. Quando vocês podem fazer a troca?",
    replies:[
     {en:"We can do it next Tuesday, during the scheduled stop.",pt:"Podemos fazer na próxima terça, durante a parada programada.",keys:["monday|tuesday|wednesday|thursday|friday|saturday","scheduled|planned|stop"],next:"n3"},
     {en:"As soon as the truck and the crane are available.",pt:"Assim que o caminhão e o guindaste estiverem disponíveis.",keys:["truck","crane"],next:"n3"}]},
  n3:{say:"What do you need from us on that day?",pt:"Do que vocês precisam da nossa parte nesse dia?",
    replies:[
     {en:"The machine must be clean, stopped and locked out.",pt:"A máquina precisa estar limpa, parada e bloqueada.",keys:["clean","stopped|stop","locked|lock"],next:"n4"},
     {en:"We need a forklift and an electrician to disconnect the motor.",pt:"Precisamos de uma empilhadeira e de um eletricista para desligar o motor.",keys:["forklift","electrician","disconnect"],next:"n4"}]},
  n4:{say:"Is the loan machine the same model as ours?",pt:"A máquina de empréstimo é do mesmo modelo que a nossa?",
    replies:[
     {en:"It's a similar model, so we'll check the connections before we start it up.",pt:"É um modelo parecido, então vamos verificar as conexões antes de partir.",keys:["similar|same","connection|connections","check"],next:"n5"}]},
  n5:{say:"Perfect. Send me the details by email so I can plan production.",pt:"Perfeito. Me mande os detalhes por e-mail para eu planejar a produção.",
    replies:[{en:"Sure. I'll send the schedule and the checklist today.",pt:"Claro. Envio o cronograma e o checklist hoje.",keys:["schedule","checklist|list","today"],next:"END"}]}
}},
{ id:"workshop", cat:"gratt", title:"Restauração na oficina: o que encontramos", partner:"Laura", role:"gerente de manutenção do cliente", level:"Avançado",
  ctx:"A decanter foi desmontada na oficina da GRATT. Explique à cliente o que foi encontrado e o que será feito.",
  start:"n1", nodes:{
  n1:{say:"Hi! Did you open our decanter already? What did you find?",pt:"Oi! Vocês já abriram nossa decanter? O que encontraram?",
    replies:[
     {en:"Yes. The main bearing on the liquid side was badly damaged, with spalling on the outer race.",pt:"Sim. O rolamento principal do lado dos líquidos estava muito danificado, com descascamento na pista externa.",keys:["bearing","damaged","outer race|spalling"],next:"n2"},
     {en:"The scroll flights are very worn, especially in the feed zone.",pt:"As helicoides do caracol estão muito desgastadas, principalmente na zona de alimentação.",keys:["scroll|conveyor","worn|wear","feed zone|feed"],next:"n3"}]},
  n2:{say:"That matches the vibration readings, right?",pt:"Isso bate com as leituras de vibração, certo?",
    replies:[
     {en:"Exactly. It explains the high acceleration we saw online.",pt:"Exatamente. Explica a aceleração alta que vimos no monitoramento online.",keys:["exactly|yes","acceleration","online|monitoring"],next:"n3"}]},
  n3:{say:"What else did you find?",pt:"O que mais vocês encontraram?",
    replies:[
     {en:"The scroll flights need hard facing, and the wear bushings must be replaced.",pt:"As helicoides precisam de revestimento duro, e as buchas de desgaste precisam ser trocadas.",keys:["hard facing|hardfacing","bushing|bushings","replaced|replace"],next:"n4"},
     {en:"We found product buildup inside the bowl, which caused unbalance.",pt:"Encontramos acúmulo de produto dentro do cilindro, o que causou desbalanceamento.",keys:["buildup|build up|deposit","bowl","unbalance|imbalance"],next:"n4"}]},
  n4:{say:"So what's the next step?",pt:"Então, qual é o próximo passo?",
    replies:[
     {en:"We'll replace the bearings and seals, then balance the rotating assembly.",pt:"Vamos trocar os rolamentos e as vedações e depois balancear o conjunto rotativo.",keys:["replace","bearing|bearings","balance"],next:"n5"}]},
  n5:{say:"And when will it be ready?",pt:"E quando ficará pronta?",
    replies:[
     {en:"In about three weeks. I'll send you photos and the final report.",pt:"Em cerca de três semanas. Vou te mandar fotos e o relatório final.",keys:["3 weeks|weeks","photo|photos|pictures","report"],next:"n6"}]},
  n6:{say:"Great. Please also tell us how to avoid this next time.",pt:"Ótimo. Por favor, diga também como evitar isso da próxima vez.",
    replies:[{en:"Sure. Better cleaning and regular greasing will make a big difference.",pt:"Claro. Uma higienização melhor e lubrificação regular fazem muita diferença.",keys:["cleaning|clean","greasing|grease|lubrication"],next:"END"}]}
}},
{ id:"cip", cat:"gratt", title:"Higienização da decanter", partner:"Joe", role:"operador de produção", level:"Básico",
  ctx:"Um operador pergunta como fazer a higienização da decanter. Explique o procedimento correto.",
  start:"n1", nodes:{
  n1:{say:"Hey, it's time to clean the decanter. Can I just open the steam valve like we always do?",pt:"Ei, está na hora de limpar a decanter. Posso só abrir a válvula de vapor como sempre fazemos?",
    replies:[
     {en:"No, please don't use direct steam. It damages the seals.",pt:"Não, por favor não use vapor direto. Ele danifica os retentores.",keys:["do not|no","steam","seal|seals"],next:"n2"},
     {en:"No. We use hot water only, at about ninety degrees.",pt:"Não. Usamos só água quente, a uns noventa graus.",keys:["hot water|water","90"],next:"n2"}]},
  n2:{say:"But our water is only about fifty five degrees.",pt:"Mas nossa água está só a uns cinquenta e cinco graus.",
    replies:[
     {en:"I know. That's not hot enough to remove the fat.",pt:"Eu sei. Não é quente o bastante para remover a gordura.",keys:["not hot|hot enough","fat|grease|tallow"],next:"n3"},
     {en:"That's why we recommend a dedicated hot water tank.",pt:"Por isso recomendamos um tanque de água quente dedicado.",keys:["dedicated|separate","tank"],next:"n3"}]},
  n3:{say:"Okay. Should I keep the machine at full speed during the cleaning?",pt:"Certo. Devo manter a máquina em velocidade máxima durante a limpeza?",
    replies:[
     {en:"No, the cleaning cycle reduces the speed automatically.",pt:"Não, o ciclo de higienização reduz a velocidade automaticamente.",keys:["no|not","cycle","speed|reduces|reduce"],next:"n4"}]},
  n4:{say:"And how much water do we need?",pt:"E quanta água precisamos?",
    replies:[
     {en:"At least fifteen cubic meters per hour, with a strong flow.",pt:"No mínimo quinze metros cúbicos por hora, com vazão forte.",keys:["15","cubic|per hour"],next:"n5"},
     {en:"The feed pump is too weak. We need a bigger pump.",pt:"A bomba de alimentação é fraca demais. Precisamos de uma bomba maior.",keys:["pump","weak|bigger|small|larger"],next:"n5"}]},
  n5:{say:"Got it. Do I need to do this every shift?",pt:"Entendi. Preciso fazer isso todo turno?",
    replies:[{en:"Yes, every shift. Dirty bowls cause unbalance and high vibration.",pt:"Sim, todo turno. Cilindro sujo causa desbalanceamento e vibração alta.",keys:["every shift|shift","unbalance|imbalance|vibration"],next:"END"}]}
}},
{ id:"blood", cat:"gratt", title:"Coagulação na linha de sangue", partner:"Peter", role:"supervisor de produção", level:"Avançado",
  ctx:"O clarificado da decanter de sangue está saindo marrom. Converse com o supervisor sobre o sistema de coagulação.",
  start:"n1", nodes:{
  n1:{say:"The clarified water from the blood decanter is brown again. What's going on?",pt:"A água clarificada da decanter de sangue está marrom de novo. O que está acontecendo?",
    replies:[
     {en:"The blood isn't coagulating well. The steam system is on bypass.",pt:"O sangue não está coagulando bem. O sistema de vapor está em by-pass.",keys:["coagulating|coagulation|coagulate","bypass|by pass"],next:"n2"},
     {en:"Probably the coagulation temperature is out of range.",pt:"Provavelmente a temperatura de coagulação está fora da faixa.",keys:["coagulation","temperature","out of range|wrong|low|high"],next:"n3"}]},
  n2:{say:"Yes. The modulating valve was stuck, so we opened the bypass.",pt:"Sim. A válvula moduladora travou, então abrimos o by-pass.",
    replies:[
     {en:"We need to repair the valve and run the system in automatic.",pt:"Precisamos consertar a válvula e operar o sistema em automático.",keys:["repair|fix","valve","automatic|auto"],next:"n3"}]},
  n3:{say:"What should the coagulation temperature be?",pt:"Qual deve ser a temperatura de coagulação?",
    replies:[
     {en:"Between 95 and 105 degrees Celsius.",pt:"Entre 95 e 105 graus Celsius.",keys:["95","105"],next:"n4"}]},
  n4:{say:"And the steam pressure? The gauge shows nine.",pt:"E a pressão do vapor? O manômetro mostra nove.",
    replies:[
     {en:"That reading is before the valve. At the injection point it should be up to two bar.",pt:"Essa leitura é antes da válvula. No ponto de injeção deve ser de até dois bar.",keys:["before","valve","2"],next:"n5"},
     {en:"Nine is too high. We need to move the pressure transmitter after the modulating valve.",pt:"Nove é alto demais. Precisamos mudar o transmissor de pressão para depois da válvula moduladora.",keys:["too high|high","transmitter","after"],next:"n5"}]},
  n5:{say:"So how do we know the coagulation is right?",pt:"Então, como sabemos que a coagulação está certa?",
    replies:[{en:"If the water comes out whitish, it's fine. If it's brown, add more steam.",pt:"Se a água sair esbranquiçada, está bom. Se sair marrom, aumente o vapor.",keys:["whitish|white|clear","brown","steam"],next:"END"}]}
}},
{ id:"process", cat:"gratt", title:"Ajuste de processo: torta úmida", partner:"Sam", role:"operador sênior", level:"Avançado",
  ctx:"Os sólidos estão saindo úmidos e o clarificado com muito sólido. Ajuste o processo junto com o operador.",
  start:"n1", nodes:{
  n1:{say:"The solids are coming out too wet today. What should we change?",pt:"Os sólidos estão saindo úmidos demais hoje. O que devemos mudar?",
    replies:[
     {en:"Let's reduce the differential speed a little.",pt:"Vamos reduzir um pouco a velocidade diferencial.",keys:["reduce|lower|decrease","differential"],next:"n2"},
     {en:"First, let's check the feed rate. Maybe it's too high.",pt:"Primeiro, vamos verificar a vazão de alimentação. Talvez esteja alta demais.",keys:["feed rate|feed|flow","too high|high"],next:"n3"}]},
  n2:{say:"If we reduce it, won't the torque go up?",pt:"Se reduzirmos, o torque não vai subir?",
    replies:[
     {en:"Yes, so we'll watch the torque and change it in small steps.",pt:"Sim, então vamos acompanhar o torque e mudar em passos pequenos.",keys:["torque","small steps|steps|slowly|little"],next:"n4"}]},
  n3:{say:"The feed rate is twelve cubic meters per hour. That's normal for us.",pt:"A vazão está em doze metros cúbicos por hora. Isso é normal para nós.",
    replies:[
     {en:"Okay, then let's look at the differential speed.",pt:"Certo, então vamos olhar a velocidade diferencial.",keys:["differential"],next:"n2"},
     {en:"Then maybe the pond is too deep. We can change the weir plates.",pt:"Então talvez a piscina esteja profunda demais. Podemos trocar os anéis de nível.",keys:["pond|deep|depth","weir|plates|ring"],next:"n4"}]},
  n4:{say:"Okay, the torque is stable at sixty percent. What else?",pt:"Certo, o torque está estável em sessenta por cento. O que mais?",
    replies:[
     {en:"Let's take a sample of the cake and the clarified liquid in thirty minutes.",pt:"Vamos coletar uma amostra da torta e do clarificado em trinta minutos.",keys:["sample","cake|solids","clarified|liquid|centrate"],next:"n5"}]},
  n5:{say:"Good idea. Should I write down the new settings?",pt:"Boa ideia. Devo anotar os novos parâmetros?",
    replies:[{en:"Yes, please record the settings in the shift log.",pt:"Sim, por favor registre os parâmetros no livro de turno.",keys:["record|write","settings|setting|parameters","log"],next:"END"}]}
}},
{ id:"monthly", cat:"gratt", title:"Reunião do relatório mensal GRATTscan", partner:"Thomas", role:"coordenador de manutenção do cliente", level:"Intermediário",
  ctx:"Você apresenta o relatório mensal do monitoramento online e o andamento do plano de ação.",
  start:"n1", nodes:{
  n1:{say:"Thanks for sending the monthly report. Can you give me a quick summary?",pt:"Obrigado por enviar o relatório mensal. Pode me dar um resumo rápido?",
    replies:[
     {en:"Sure. Two machines are critical, and the others are stable.",pt:"Claro. Duas máquinas estão críticas e as outras estão estáveis.",keys:["2","critical","stable|normal"],next:"n2"},
     {en:"The main concern is the blood decanter. It was above the alarm most of the month.",pt:"A maior preocupação é a decanter de sangue. Ela ficou acima do alarme a maior parte do mês.",keys:["blood","alarm","month|most"],next:"n2"}]},
  n2:{say:"I saw some events in the report. Which bearing caused them?",pt:"Vi alguns eventos no relatório. Qual mancal os gerou?",
    replies:[
     {en:"The events are for the whole asset, so they don't show which bearing.",pt:"Os eventos são do ativo inteiro, então não mostram qual mancal.",keys:["whole|asset|machine","bearing","do not|does not|not"],next:"n3"},
     {en:"We compared them with the graphs. The peaks came from the liquid side.",pt:"Comparamos com os gráficos. Os picos vieram do lado dos líquidos.",keys:["compared|compare","graph|graphs|chart|charts","liquid"],next:"n3"}]},
  n3:{say:"What about the action plan? Are we late on anything?",pt:"E o plano de ação? Estamos atrasados em alguma coisa?",
    replies:[
     {en:"Yes. The steam valve repair is still pending, and it's past the due date.",pt:"Sim. O conserto da válvula de vapor continua pendente e já passou do prazo.",keys:["pending|open","due date|late|overdue"],next:"n4"},
     {en:"Most actions are on track, but the lubrication log isn't being filled in.",pt:"A maioria das ações está em dia, mas o registro de lubrificação não está sendo preenchido.",keys:["on track|fine","lubrication","log"],next:"n4"}]},
  n4:{say:"Okay. What do you need from my team this month?",pt:"Certo. O que você precisa da minha equipe este mês?",
    replies:[
     {en:"Please release the machine for the overhaul and keep greasing every 48 hours.",pt:"Por favor, liberem a máquina para a restauração e mantenham a lubrificação a cada 48 horas.",keys:["release","overhaul|restoration","48|grease|greasing"],next:"n5"}]},
  n5:{say:"Fine. Let's review it again next month.",pt:"Combinado. Vamos revisar de novo no mês que vem.",
    replies:[{en:"Great. I'll update the action plan and send you the link.",pt:"Ótimo. Vou atualizar o plano de ação e te mandar o link.",keys:["update","action plan|plan","link|send"],next:"END"}]}
}},
{ id:"warranty", cat:"gratt", title:"Reclamação após a preventiva", partner:"Linda", role:"coordenadora de manutenção do cliente", level:"Intermediário",
  ctx:"Três dias depois da preventiva, a cliente liga dizendo que a máquina está vibrando. Atenda a reclamação.",
  start:"n1", nodes:{
  n1:{say:"Hi. You did the preventive maintenance on Monday, and now the decanter is vibrating a lot.",pt:"Oi. Vocês fizeram a preventiva na segunda e agora a decanter está vibrando muito.",
    replies:[
     {en:"I'm sorry to hear that. When did it start?",pt:"Sinto muito. Quando começou?",keys:["sorry","when","start"],next:"n2"},
     {en:"Thanks for letting us know. Can you send me the vibration readings?",pt:"Obrigado por avisar. Pode me enviar as leituras de vibração?",keys:["thanks|thank","send","readings|reading|data"],next:"n3"}]},
  n2:{say:"It started this morning, after the cleaning cycle.",pt:"Começou hoje de manhã, depois do ciclo de higienização.",
    replies:[
     {en:"Okay. It could be product buildup in the bowl. Was the water hot enough?",pt:"Certo. Pode ser acúmulo de produto no cilindro. A água estava quente o bastante?",keys:["buildup|build up|product","bowl","water|hot"],next:"n4"}]},
  n3:{say:"Sure. The online system shows thirty millimeters per second on the solids side.",pt:"Claro. O sistema online mostra trinta milímetros por segundo no lado dos sólidos.",
    replies:[
     {en:"That's above the alarm. Please don't run it until we check it.",pt:"Isso está acima do alarme. Por favor, não operem até verificarmos.",keys:["above","alarm","do not run|not run|stop"],next:"n4"}]},
  n4:{say:"So, is this covered by the contract?",pt:"Então, isso está coberto pelo contrato?",
    replies:[
     {en:"Yes. Failures reported within five days after a preventive are covered.",pt:"Sim. Falhas comunicadas em até cinco dias após a preventiva estão cobertas.",keys:["5","days","covered|warranty"],next:"n5"}]},
  n5:{say:"Good. When can someone come?",pt:"Ótimo. Quando alguém pode vir?",
    replies:[
     {en:"Our technician can be there tomorrow morning.",pt:"Nosso técnico pode estar aí amanhã de manhã.",keys:["technician","tomorrow"],next:"n6"},
     {en:"We'll send a technician today.",pt:"Vamos mandar um técnico hoje.",keys:["technician","today"],next:"n6"}]},
  n6:{say:"Thank you. Please confirm by email.",pt:"Obrigada. Por favor, confirme por e-mail.",
    replies:[{en:"Of course. I'll confirm by email in a few minutes.",pt:"Claro. Confirmo por e-mail em alguns minutos.",keys:["confirm","email|e mail"],next:"END"}]}
}},
{ id:"induction", cat:"gratt", title:"Integração de segurança no cliente", partner:"Rachel", role:"técnica de segurança do cliente", level:"Básico",
  ctx:"Você chega com a equipe para um atendimento e passa pela integração de segurança do cliente.",
  start:"n1", nodes:{
  n1:{say:"Good morning. Do you have the documents for your team?",pt:"Bom dia. Vocês têm os documentos da equipe?",
    replies:[
     {en:"Yes. We sent them by email last week.",pt:"Sim. Enviamos por e-mail na semana passada.",keys:["sent|send","email|e mail","last week|week"],next:"n2"},
     {en:"Yes, here are the training certificates and the medical exams.",pt:"Sim, aqui estão os certificados de treinamento e os exames médicos.",keys:["certificate|certificates","medical|exams|exam"],next:"n2"}]},
  n2:{say:"Thank you. Do you have your safety shoes, glasses and ear protection?",pt:"Obrigada. Vocês têm sapato de segurança, óculos e protetor auricular?",
    replies:[
     {en:"Yes, everyone has their own PPE.",pt:"Sim, todos têm seu próprio EPI.",keys:["everyone|all","ppe|p p e|equipment"],next:"n3"}]},
  n3:{say:"Will you do any hot work, like welding or grinding?",pt:"Vocês vão fazer algum trabalho a quente, como solda ou esmerilhamento?",
    replies:[
     {en:"No, only mechanical work and vibration measurements.",pt:"Não, só trabalho mecânico e medições de vibração.",keys:["no|not","mechanical","vibration|measurements"],next:"n4"},
     {en:"Yes, a little grinding. We'll need a hot work permit.",pt:"Sim, um pouco de esmerilhamento. Vamos precisar de permissão para trabalho a quente.",keys:["grinding|welding","hot work|permit"],next:"n4"}]},
  n4:{say:"Okay. Where is the meeting point in case of an emergency?",pt:"Certo. Onde é o ponto de encontro em caso de emergência?",
    replies:[
     {en:"The meeting point is near the main gate.",pt:"O ponto de encontro é perto da portaria principal.",keys:["meeting point","gate|entrance"],next:"n5"}]},
  n5:{say:"Correct. You're all set. Have a safe day!",pt:"Correto. Tudo certo. Tenham um dia seguro!",
    replies:[{en:"Thank you. Have a nice day too.",pt:"Obrigado. Tenha um bom dia também.",keys:["thank","day"],next:"END"}]}
}},
{ id:"tricanter", cat:"gratt", title:"Tridecanter: separação em três fases", partner:"Kevin", role:"engenheiro de processo recém-contratado", level:"Intermediário",
  ctx:"Um engenheiro novo quer entender a diferença entre a decanter e a tridecanter. Explique.",
  start:"n1", nodes:{
  n1:{say:"What's the difference between a decanter and a tricanter?",pt:"Qual a diferença entre uma decanter e uma tridecanter?",
    replies:[
     {en:"A decanter separates two phases. A tricanter separates three: oil, water and solids.",pt:"A decanter separa duas fases. A tridecanter separa três: óleo, água e sólidos.",keys:["2","3","oil","water","solids|solid"],next:"n2"}]},
  n2:{say:"How does the oil come out separately?",pt:"Como o óleo sai separado?",
    replies:[
     {en:"The oil is lighter, so it stays near the center and leaves through its own outlet.",pt:"O óleo é mais leve, então fica perto do centro e sai por uma saída própria.",keys:["lighter|light","center|centre","outlet|exit"],next:"n3"},
     {en:"There's a separate discharge for the light phase.",pt:"Existe uma descarga separada para a fase leve.",keys:["separate","discharge|outlet","light phase|light"],next:"n3"}]},
  n3:{say:"And if there's water in the oil, what do we adjust?",pt:"E se tiver água no óleo, o que ajustamos?",
    replies:[
     {en:"We adjust the ring dams to move the interface.",pt:"Ajustamos os anéis de nível para mover a interface.",keys:["ring dam|ring dams|weir|ring","interface"],next:"n4"},
     {en:"We can try changing the feed rate or the temperature first.",pt:"Podemos tentar mudar a vazão de alimentação ou a temperatura primeiro.",keys:["feed rate|feed","temperature"],next:"n4"}]},
  n4:{say:"Does it need more maintenance than a decanter?",pt:"Ela precisa de mais manutenção que uma decanter?",
    replies:[{en:"About the same, but the cleaning must be very good to keep the outlets clear.",pt:"Mais ou menos a mesma, mas a higienização precisa ser muito boa para manter as saídas desobstruídas.",keys:["same","cleaning|clean","outlets|outlet"],next:"END"}]}
}}
];

{ id:"coffee", cat:"new", title:"Café na oficina antes do turno", partner:"Dave", role:"colega mecânico, piadista oficial", level:"Básico",
  ctx:"Segunda, 6h50, cafeteira da oficina. Nada técnico: fim de semana, futebol e o carro novo do chefe.",
  start:"n1", nodes:{
  n1:{say:"Morning! Wow, you look like you slept inside the gearbox. Rough weekend?",pt:"Bom dia! Nossa, você está com cara de quem dormiu dentro do redutor. Fim de semana pesado?",
    replies:[
     {en:"Ha! Kind of. We had a barbecue on Sunday and it went until midnight.",pt:"Rá! Mais ou menos. Teve churrasco no domingo e foi até meia-noite.",keys:["barbecue","sunday","midnight"],next:"n2"},
     {en:"Not really. My neighbor's dog barked all night.",pt:"Na verdade, não. O cachorro do vizinho latiu a noite toda.",keys:["neighbor|neighbour","dog","all night|night"],next:"n3"}]},
  n2:{say:"A barbecue until midnight? Okay, now I'm jealous. Who did the grilling?",pt:"Churrasco até meia-noite? Tá, agora fiquei com inveja. Quem cuidou da churrasqueira?",
    replies:[
     {en:"My brother in law. He burned the first batch, but the rest was great.",pt:"Meu cunhado. Ele queimou a primeira leva, mas o resto ficou ótimo.",keys:["brother in law|brother","burned|burnt","great|good"],next:"n4"},
     {en:"I did, of course. Nobody touches my grill.",pt:"Eu, claro. Ninguém mexe na minha churrasqueira.",keys:["i did|me","nobody|no one","grill"],next:"n4"}]},
  n3:{say:"Oh man, that's the worst. Did you talk to your neighbor?",pt:"Putz, isso é o pior. Você falou com o vizinho?",
    replies:[
     {en:"Not yet. I'll talk to him tonight, if I'm still awake.",pt:"Ainda não. Vou falar com ele hoje à noite, se eu ainda estiver acordado.",keys:["not yet","tonight","awake"],next:"n4"}]},
  n4:{say:"Speaking of noise, did you see the boss's new car? It's louder than decanter number three.",pt:"Falando em barulho, viu o carro novo do chefe? É mais barulhento que a decanter número três.",
    replies:[
     {en:"Yes! Maybe we should put a vibration sensor on it.",pt:"Sim! Talvez a gente devesse colocar um sensor de vibração nele.",keys:["vibration","sensor"],next:"n5"},
     {en:"No, I didn't. What kind of car is it?",pt:"Não vi. Que carro é?",keys:["what kind|which","car"],next:"n6"}]},
  n5:{say:"Ha ha! Alert at twenty, alarm at twenty five, and an automatic email to his wife.",pt:"Rá rá! Alerta em vinte, alarme em vinte e cinco e um e-mail automático para a esposa dele.",
    replies:[
     {en:"That's a good one. But don't say that when he's around.",pt:"Essa foi boa. Mas não fala isso quando ele estiver por perto.",keys:["good one|good","around|here|near"],next:"n7"}]},
  n6:{say:"Some red sports car. He says it cost less than a bearing kit. I don't believe him.",pt:"Um esportivo vermelho. Ele diz que custou menos que um kit de rolamentos. Não acredito nele.",
    replies:[
     {en:"Me neither. Our bearing kits aren't that cheap.",pt:"Nem eu. Nossos kits de rolamento não são tão baratos.",keys:["me neither|neither","cheap|expensive"],next:"n7"}]},
  n7:{say:"Alright, coffee's ready. What's on your list today?",pt:"Beleza, o café está pronto. O que tem na sua lista hoje?",
    replies:[
     {en:"First the greasing round, then a vibration route on the blood line.",pt:"Primeiro a rota de lubrificação, depois uma rota de vibração na linha de sangue.",keys:["greasing|grease","vibration","blood|line"],next:"n8"},
     {en:"I'm swamped. Two work orders and a meeting at ten.",pt:"Estou atolado. Duas ordens de serviço e uma reunião às dez.",keys:["swamped|busy","work order|work orders","meeting","10"],next:"n8"}]},
  n8:{say:"Good luck, buddy. If the boss asks, I was here since six.",pt:"Boa sorte, parceiro. Se o chefe perguntar, eu estou aqui desde as seis.",
    replies:[{en:"Sure, sure. Your secret is safe with me.",pt:"Claro, claro. Seu segredo está seguro comigo.",keys:["secret","safe"],next:"END"}]}
}},
{ id:"ete", cat:"new", title:"ETE: o lodo resolveu passear", partner:"Carla", role:"operadora da estação de tratamento de efluentes", level:"Intermediário",
  ctx:"Terça, 14h. O efluente do flotador está turvo e a bomba de lodo desarmou. Ajude a operadora a descobrir o porquê.",
  start:"n1", nodes:{
  n1:{say:"Hey, glad you're here. The water from the flotation unit looks like chocolate milk.",pt:"Oi, que bom que você chegou. A água do flotador está parecendo achocolatado.",
    replies:[
     {en:"That doesn't look good. When did it start?",pt:"Isso não parece bom. Quando começou?",keys:["when","start"],next:"n2"},
     {en:"Did you check the chemical dosing pump?",pt:"Você verificou a bomba dosadora de produto químico?",keys:["check","dosing|chemical","pump"],next:"n3"}]},
  n2:{say:"Around ten this morning. Right after production started washing the slaughter area.",pt:"Por volta das dez da manhã. Logo depois que a produção começou a lavar a área de abate.",
    replies:[
     {en:"So the flow went up and the system couldn't handle it.",pt:"Então a vazão subiu e o sistema não deu conta.",keys:["flow","went up|increased|higher|up","handle|couldn't|could not"],next:"n4"},
     {en:"Okay. Did you check the chemical dosing pump?",pt:"Certo. Você verificou a bomba dosadora de produto químico?",keys:["check","dosing|chemical","pump"],next:"n3"}]},
  n3:{say:"Yes, the polymer pump is running, but the tank is almost empty. Oops.",pt:"Sim, a bomba de polímero está rodando, mas o tanque está quase vazio. Ops.",
    replies:[
     {en:"Well, there's our problem. Who's in charge of refilling it?",pt:"Bom, aí está o nosso problema. Quem é o responsável por reabastecer?",keys:["problem","who","refill|refilling|fill"],next:"n5"}]},
  n4:{say:"Probably. The flow meter shows eighty cubic meters per hour. Normal is fifty.",pt:"Provavelmente. O medidor de vazão mostra oitenta metros cúbicos por hora. O normal é cinquenta.",
    replies:[
     {en:"That's way too high. We need to use the equalization tank.",pt:"Está alto demais. Precisamos usar o tanque de equalização.",keys:["too high|high","equalization|equalisation|tank"],next:"n3"}]},
  n5:{say:"Me, unfortunately. The supplier was supposed to deliver on Monday. Still nothing.",pt:"Eu, infelizmente. O fornecedor devia entregar na segunda. Até agora nada.",
    replies:[
     {en:"Let's call them now and ask for an emergency delivery.",pt:"Vamos ligar para eles agora e pedir uma entrega de emergência.",keys:["call","emergency|urgent","delivery|deliver"],next:"n6"},
     {en:"How much does one drum cost?",pt:"Quanto custa um tambor?",keys:["how much","cost","drum"],next:"n7"}]},
  n6:{say:"Good idea. And what about the sludge pump? It tripped twice today.",pt:"Boa ideia. E a bomba de lodo? Ela desarmou duas vezes hoje.",
    replies:[
     {en:"The sludge may be too thick. Let's check the motor current.",pt:"O lodo pode estar grosso demais. Vamos verificar a corrente do motor.",keys:["sludge","thick","current|amps"],next:"n8"}]},
  n7:{say:"About eight hundred reais per drum. My manager says it's expensive, but a fine is worse.",pt:"Uns oitocentos reais o tambor. Meu gerente diz que é caro, mas multa é pior.",
    replies:[
     {en:"Exactly. An environmental fine costs much more than that.",pt:"Exatamente. Uma multa ambiental custa muito mais que isso.",keys:["environmental|fine","more|much more"],next:"n6"}]},
  n8:{say:"Twenty two amps. The nameplate says eighteen. Is my pump on a diet or not?",pt:"Vinte e dois ampères. A placa diz dezoito. Minha bomba está de dieta ou não?",
    replies:[
     {en:"Definitely not. It's overloaded. Let's dilute the sludge and check the impeller.",pt:"Com certeza não. Está sobrecarregada. Vamos diluir o lodo e verificar o rotor.",keys:["overloaded|overload","dilute|water","impeller|rotor"],next:"n9"}]},
  n9:{say:"Deal. I'll write everything in the log. Coffee after this?",pt:"Fechado. Vou anotar tudo no registro. Café depois disso?",
    replies:[{en:"Definitely. After we save the river.",pt:"Com certeza. Depois de salvarmos o rio.",keys:["definitely|sure|yes","river|save"],next:"END"}]}
}},
{ id:"motor", cat:"new", title:"Motor elétrico com cheiro de torrada", partner:"Bruno", role:"eletricista de manutenção", level:"Intermediário",
  ctx:"Quinta, 22h. O motor da bomba de alimentação está quente e com cheiro de queimado. Investigue com o eletricista.",
  start:"n1", nodes:{
  n1:{say:"Hey! Smell that? The feed pump motor smells like burnt toast.",pt:"Ei! Sentiu esse cheiro? O motor da bomba de alimentação está com cheiro de torrada queimada.",
    replies:[
     {en:"Yeah, that's not breakfast. Let's shut it down first.",pt:"É, isso não é café da manhã. Vamos desligar primeiro.",keys:["shut|stop|turn off","first"],next:"n2"},
     {en:"How hot is it? Do you have the thermal camera?",pt:"Quão quente ele está? Você tem a câmera térmica?",keys:["how hot|hot","thermal|camera"],next:"n3"}]},
  n2:{say:"Done. It's locked out. Where do we start?",pt:"Feito. Está bloqueado. Por onde começamos?",
    replies:[
     {en:"Let's do an insulation test with the megger.",pt:"Vamos fazer um teste de isolação com o megômetro.",keys:["insulation","megger|megohmmeter|test"],next:"n4"},
     {en:"First, check the cooling fan and the fan cover.",pt:"Primeiro, verifique a ventoinha e a tampa defletora.",keys:["fan","cover|cooling"],next:"n5"}]},
  n3:{say:"Ninety five degrees on the frame. The class F limit is much higher, but this is weird.",pt:"Noventa e cinco graus na carcaça. O limite da classe F é bem maior, mas isso é estranho.",
    replies:[
     {en:"Agreed. Let's shut it down and lock it out.",pt:"Concordo. Vamos desligar e bloquear.",keys:["shut|stop|turn off","lock"],next:"n2"}]},
  n4:{say:"The insulation is fine, more than one hundred megohms. So it's not the winding.",pt:"A isolação está boa, mais de cem megaohms. Então não é o enrolamento.",
    replies:[
     {en:"Good. Then let's check the current on each phase.",pt:"Ótimo. Então vamos medir a corrente em cada fase.",keys:["current|amps","phase"],next:"n6"},
     {en:"Okay. Then check the cooling fan.",pt:"Certo. Então verifique a ventoinha.",keys:["fan|cooling"],next:"n5"}]},
  n5:{say:"Found it! The fan cover is full of fat and feathers. It looks like a bird's nest.",pt:"Achei! A tampa defletora está cheia de gordura e penas. Parece um ninho de passarinho.",
    replies:[
     {en:"No wonder it was overheating. Let's clean it and check the current.",pt:"Não é à toa que estava superaquecendo. Vamos limpar e medir a corrente.",keys:["no wonder|overheating|overheat","clean","current"],next:"n6"}]},
  n6:{say:"Phase one, fourteen amps. Phase two, fourteen. Phase three, nineteen. Hmm.",pt:"Fase um, catorze ampères. Fase dois, catorze. Fase três, dezenove. Hum.",
    replies:[
     {en:"That's unbalanced. Maybe there's a loose connection in the terminal box.",pt:"Está desequilibrado. Talvez tenha uma conexão frouxa na caixa de ligação.",keys:["unbalanced|unbalance|imbalance","loose","connection|terminal"],next:"n7"},
     {en:"Let's check the contactor and the inverter.",pt:"Vamos verificar o contator e o inversor.",keys:["contactor","inverter|drive|vfd"],next:"n7"}]},
  n7:{say:"You were right. One terminal was loose and a little black. Good catch!",pt:"Você estava certo. Um terminal estava frouxo e meio preto. Boa sacada!",
    replies:[
     {en:"Let's replace the terminal and tighten everything to the right torque.",pt:"Vamos trocar o terminal e apertar tudo com o torque correto.",keys:["replace|change","terminal","tighten|torque"],next:"n8"}]},
  n8:{say:"Done. It's ten forty five. Should we start it now or wait for the morning shift?",pt:"Feito. São dez e quarenta e cinco. Partimos agora ou esperamos o turno da manhã?",
    replies:[
     {en:"Let's start it now and check the current again in thirty minutes.",pt:"Vamos partir agora e medir a corrente de novo em trinta minutos.",keys:["start|now","current|check","30|minutes"],next:"n9"}]},
  n9:{say:"Perfect. And next time somebody smells toast, it's not my sandwich.",pt:"Perfeito. E da próxima vez que alguém sentir cheiro de torrada, não é o meu sanduíche.",
